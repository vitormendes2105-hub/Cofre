    const parts=[s.sep?`Separado <b>${fmt(s.sep)}</b>`:'',s.dev?`Devolvido <b>${fmt(s.dev)}</b>`:'',s.spent?`Gasto <b>${fmt(s.spent)}</b>`:''].filter(Boolean);
    return `<div class="obc ${s.st}"><div class="obc-h"><b>${esc(b.name)}</b><button class="pen" data-id="${b.id}" onclick="cxEdit(this.dataset.id)" title="Editar">${pen}</button></div>
      <div class="obc-m">${ringCol(s.p,46,col)}<div style="flex:1"><div class="obc-v">${fmt(s.rem)}</div><div class="gsub">${s.avail>0?'de '+fmt(s.avail)+' no mês':'saldo da caixinha'}</div></div>${badge}</div>
      ${note}<div class="gsub">${parts.length?parts.join(' · '):'Sem movimento neste mês'}</div>
      <div class="bx-act"><button class="chip" data-id="${b.id}" onclick="cxSeparar(this.dataset.id)">Separar</button><button class="chip" data-id="${b.id}" onclick="cxDevolver(this.dataset.id)">Devolver</button><button class="chip" data-id="${b.id}" onclick="cxMoves(this.dataset.id)">Movimentos</button></div></div>`;
  }).join('');
  return monthNav()+`<div class="card"><div class="card-head" style="cursor:default"><h2>Caixinhas</h2><button class="chip" onclick="cxNew()">+ Nova caixinha</button></div>
    <div class="bxs"><div class="obtot"><div class="gsub">Na conta corrente</div><div class="obc-v" style="font-size:22px;white-space:nowrap${conta<0?';color:var(--red)':''}">${fmt(conta)}</div>${(m===curMonth()&&(state.openingBalance||{})[m]===undefined)?'<div class="gsub" style="margin:4px 0 0">Ainda não ajustado ao banco.</div>':''}<button class="chip" style="margin-top:8px" onclick="cxAjustarConta()">Ajustar ao saldo do banco</button></div>
    <div class="obtot"><div class="gsub">Nas caixinhas</div><div class="obc-v">${fmt(cx)}</div><div class="gsub" style="margin-top:6px">Dinheiro total: ${fmt(tot)}</div></div></div>
    <div class="obg">${cards||'<div class="empty"><b>Como começar:</b> 1) toque em “+ Nova caixinha” para cada dinheiro que você separa no banco (Mercado, Farmácia, Supérfluos…) e informe quanto cada uma tem hoje; 2) toque em “Ajustar ao saldo do banco” e digite o saldo da conta corrente. Separar não conta como gasto: só muda o dinheiro de lugar. Ao lançar uma saída, escolha em “Pagar com” a caixinha.</div>'}</div></div>`;
}
function cxNew(){
  openForm('Nova caixinha',[{id:'n',label:'Nome',kind:'text',placeholder:'Ex.: Mercado'},{id:'s',label:'Quanto já tem nela hoje (R$)',kind:'money',placeholder:'0,00'},{id:'l',label:'Categorias que saem dela (opcional, separe por vírgula)',kind:'text',placeholder:'Ex.: Farmácia, Consulta'}],v=>{
    const n=String(v.n||'').trim(); if(!n) return 'Dê um nome à caixinha.';
    if(boxes().some(b=>norm(b.name)===norm(n))) return 'Já existe uma caixinha com esse nome.';
    state.caixinhas=boxes().concat([{id:'x'+uid(),name:n,base:Math.max(0,parseMoney(v.s)),links:String(v.l||'').trim()}]); saveState();
  },'Criar','O dinheiro que já está nela sai da conta corrente aqui no app. Depois confira o saldo da conta em “Ajustar ao saldo do banco”.');
}
function cxEdit(id){
  const b=boxById(id); if(!b) return; const cur=boxBalanceAt(id,todayISO());
  openForm('Caixinha '+b.name,[{id:'n',label:'Nome',kind:'text',value:b.name},{id:'s',label:'Saldo de hoje (R$)',kind:'money',value:String(cur).replace('.',',')},{id:'l',label:'Categorias que saem dela (separe por vírgula)',kind:'text',value:b.links||''}],v=>{
    const n=String(v.n||'').trim(); if(!n) return 'Dê um nome à caixinha.';
    if(boxes().some(x=>x.id!==id&&norm(x.name)===norm(n))) return 'Já existe uma caixinha com esse nome.';
    b.name=n; b.links=String(v.l||'').trim();
    if(String(v.s).trim()!==''){ const typed=parseMoney(v.s); if(Math.abs(typed-cur)>0.004) b.base=r2((Number(b.base)||0)+typed-cur); }
    saveState();
  },'Salvar','Se mudar o saldo, confira depois a conta corrente em “Ajustar ao saldo do banco”.');
  ui.modal.extra=`<button class="btn btn-danger" onclick="closeModal();cxDelete('${id}')">Excluir caixinha</button>`; renderModal2();
}
function cxDelete(id){
  const b=boxById(id); if(!b) return;
  askConfirm('Excluir a caixinha <b>'+esc(b.name)+'</b>? O saldo dela ('+fmt(boxBalanceAt(id,todayISO()))+') volta para a conta corrente. Seus lançamentos não são apagados.',()=>{
    state.caixinhas=boxes().filter(x=>x.id!==id); state.transfers=(state.transfers||[]).filter(t=>t.boxId!==id);
    state.transactions.forEach(t=>{ if(t.boxId===id){ delete t.boxId; delete t.boxAmt; } });
    saveState(); render();
  });
}
function cxBudgetsOf(boxId){ return budgetsOf().filter(b=>b.boxId===boxId); }
function cxCutField(id,devolver){
  const lb=cxBudgetsOf(id)[0]; if(!lb) return null;
  const yes=devolver?'Sim, diminuir o limite de '+lb.category+' neste mês':'Sim, aumentar o limite de '+lb.category+' neste mês', no='Não, manter o limite';
  return {lb:lb,yes:yes,no:no,field:{id:'cut',label:devolver?'Esse dinheiro não volta para o '+lb.category+'?':'Esse dinheiro é reposição do '+lb.category+'?',kind:'select',options:devolver?[yes,no]:[no,yes],value:devolver?yes:no}};
}
function cxSeparar(id){
  const b=boxById(id); if(!b) return; const cf=cxCutField(id,false);
  openForm('Separar para '+b.name,[{id:'v',label:'Quanto separar da conta corrente (R$)',kind:'money'},{id:'d',label:'Data',kind:'date',value:todayISO()}].concat(cf?[cf.field]:[]),v=>{
    const a=r2(parseMoney(v.v)); if(a<=0) return 'Digite um valor maior que zero.';
    const d=v.d||todayISO(), conta=contaAt(d);
    if(a>conta+0.004) return 'A conta corrente só tem '+fmtRaw(conta)+'. Se isso não bate com o banco, use “Ajustar ao saldo do banco”.';
    const tr={id:'f'+uid(),date:d,boxId:id,amount:a}; if(cf&&v.cut===cf.yes) tr.budgetId=cf.lb.id;
    state.transfers=(state.transfers||[]).concat([tr]); saveState();
  },'Separar','Separar não é gasto: o dinheiro só sai da conta corrente e vai para a caixinha.');
}
function cxDevolver(id){
  const b=boxById(id); if(!b) return; const cf=cxCutField(id,true);
  openForm('Devolver de '+b.name,[{id:'v',label:'Quanto devolver para a conta corrente (R$)',kind:'money'},{id:'d',label:'Data',kind:'date',value:todayISO()}].concat(cf?[cf.field]:[]),v=>{
    const a=r2(parseMoney(v.v)); if(a<=0) return 'Digite um valor maior que zero.';
    const d=v.d||todayISO(), bal=boxBalanceAt(id,d);
    if(a>bal+0.004) return 'A caixinha só tem '+fmtRaw(bal)+'.';
    const tr={id:'f'+uid(),date:d,boxId:id,amount:-a}; if(cf&&v.cut===cf.yes) tr.budgetId=cf.lb.id;
    state.transfers=(state.transfers||[]).concat([tr]); saveState();
  },'Devolver',cf?'Se o dinheiro vai para outra coisa e não volta, o limite do orçamento diminui só neste mês. Se pretende repor, escolha manter.':'');
}
function cxAjustarConta(){
  openForm('Saldo da conta corrente hoje',[{id:'v',label:'Quanto tem na conta hoje (R$)',kind:'money',value:String(contaAt(todayISO())).replace('.',',')}],v=>{
    if(String(v.v).trim()==='') return 'Digite o saldo da conta.';
    const target=parseMoney(v.v), cm=curMonth(), today=todayISO();
    const want=r2(target+boxTotalAt(today)), flows=r2(txInMonth(cm).filter(t=>t.date<=today).reduce((a,t)=>a+(t.type==='income'?t.amount:-t.amount),0));
    state.openingBalance=state.openingBalance||{}; state.openingBalance[cm]=r2(want-flows); saveState();
  },'Salvar','Digite o saldo que o banco mostra só para a conta corrente, sem as caixinhas. O app acerta o resto sozinho.');
}
function cxDelTransfer(tid,bid){ state.transfers=(state.transfers||[]).filter(t=>t.id!==tid); saveState(); closeModal(); cxMoves(bid); }

// ===== Limite do orçamento por mês, ligação com a caixinha e movimentações no Lançamentos =====
// Limite do mês = limite padrão + devoluções/separações marcadas para mexer no limite + ajustes manuais do mês.
function budgetAdjDetail(b,m){
  const tr=r2((state.transfers||[]).filter(t=>t.budgetId===b.id&&t.date.slice(0,7)===m).reduce((a,t)=>a+t.amount,0));
  const man=r2(Number(((state.budgetAdj||{})[b.id+'|'+m])||0));
  return {tr:tr,man:man,limit:Math.max(0,r2((Number(b.amount)||0)+tr+man))};
}
function budgetLimit(b,m){ return budgetAdjDetail(b,m).limit; }
function budgetAdjNote(b,m){
  const d=budgetAdjDetail(b,m); if(!d.tr&&!d.man) return '';
  const parts=[];
  if(d.tr) parts.push((d.tr<0?'− ':'+ ')+fmt(Math.abs(d.tr))+(d.tr<0?' retirados da caixinha':' repostos na caixinha'));
  if(d.man) parts.push((d.man<0?'− ':'+ ')+fmt(Math.abs(d.man))+' ajustados');
  return `<div class="gsub">Limite padrão ${fmt(b.amount)} · ${parts.join(' · ')}</div>`;
}
function budgetAdjForm(id){
  const b=budgetsOf().find(x=>x.id===id); if(!b) return; const m=ui.month, d=budgetAdjDetail(b,m), key=id+'|'+m;
  openForm('Ajustar limite de '+b.category,[{id:'v',label:'Quanto tirar do limite de '+monthLabel(m)+' (R$)',kind:'money',placeholder:'Ex.: 128,00'}],v=>{
    const a=parseMoney(v.v); if(!a) return 'Digite um valor. Use um número negativo para aumentar o limite.';
    state.budgetAdj=state.budgetAdj||{}; state.budgetAdj[key]=r2((Number(state.budgetAdj[key])||0)-a); saveState();
  },'Aplicar','Limite deste mês agora: '+fmtRaw(d.limit)+' (padrão '+fmtRaw(b.amount)+'). Só este mês muda. Para aumentar o limite, digite um número negativo.');
  if(d.man) ui.modal.extra=`<button class="btn btn-ghost" onclick="closeModal();budgetAdjReset('${id}')">Desfazer ajustes manuais deste mês</button>`;
  renderModal2();
}

function budgetBoxBlock(b,m,s){

function mvItems(){

  if(f.type==='income'||f.type==='expense') return [];

  const q=f.search?normalizeStr(f.search):'';
  return (state.transfers||[]).filter(t=>t.date.slice(0,7)===ui.month&&boxById(t.boxId)).filter(t=>{
    if(!q) return true; return normalizeStr(boxById(t.boxId).name+' '+(t.amount>0?'separado separar':'devolvido devolver')+' caixinha').includes(q); });

function mixMoves(txs,mvs){
  const out=txs.map(t=>({t:t,d:t.date})), m=mvs.slice(), mode=txSortMode();
  if(!m.length) return txs;
  const asc=mode==='date_asc';
  m.sort((a,b)=>asc?a.date.localeCompare(b.date):b.date.localeCompare(a.date));
  if(mode==='amount_desc'||mode==='amount_asc') return txs.concat(m.map(x=>({mv:x})));
  const res=[]; let i=0, j=0;
  while(i<out.length||j<m.length){
    if(j>=m.length){ res.push(out[i++].t); continue; }
    if(i>=out.length){ res.push({mv:m[j++]}); continue; }
    const takeMove=asc?(m[j].date<=out[i].d):(m[j].date>=out[i].d);
    if(takeMove) res.push({mv:m[j++]}); else res.push(out[i++].t);
  }
  return res;
}

// ===== Quanto o seu dia custa (todos os gastos do dia a dia) e o que isso significa até o próximo recebimento =====
function ritmoReal(){
  if(ui.month!==curMonth()) return null;
  const today=todayISO(), ex=state.transactions.filter(t=>t.type==='expense'&&!t.linkedType&&t.date<=today);
  if(!ex.length) return null;
  const first=ex.reduce((a,t)=>t.date<a?t.date:a,ex[0].date);
  const n=Math.max(1,Math.min(30,Math.round((new Date(today)-new Date(first))/86400000)+1));
  const s=new Date(); s.setDate(s.getDate()-(n-1));
  const lo=s.getFullYear()+'-'+String(s.getMonth()+1).padStart(2,'0')+'-'+String(s.getDate()).padStart(2,'0');
  const total=r2(ex.filter(t=>t.date>=lo).reduce((a,t)=>a+t.amount,0));
  return {media:r2(total/n),dias:n,total};
}
function ritmoCard(){
  const r=ritmo(), rr=ritmoReal(); if(!r||!rr) return '';
  const today=todayISO(), conta=contaAt(today), cx=boxTotalAt(today), tot=r2(conta+cx), ac=aindaCai(curMonth());
  const pend=r2(ac.contas+ac.parcelas), gasto=r2(rr.media*r.days), fim=r2(tot-pend-gasto), maxDia=r2(Math.max(0,tot-pend)/r.days);
  const ate=r.pd?'o dia '+r.pd+' (recebimento)':'o fim do mês';
  return `<div class="card"><h2>No ritmo de hoje</h2>
    <p class="lead" style="font-size:14.5px;margin:10px 0">Seu dia está custando em média <b>${fmt(rr.media)}</b> (${rr.dias===30?'últimos 30 dias':'últimos '+rr.dias+' dia(s)'}, todos os gastos do dia a dia, com ou sem orçamento). Faltam <b>${r.days} dia(s)</b> até ${ate}.</p>
    <div class="commit-row"><span>Dinheiro hoje <small style="color:var(--muted)">(conta ${fmt(conta)} + caixinhas ${fmt(cx)})</small></span><span><b>${fmt(tot)}</b></span></div>
    <div class="commit-row"><span>Contas e parcelas ainda pendentes</span><span>− ${fmt(pend)}</span></div>
    <div class="commit-row"><span>Gastos do dia a dia no mesmo ritmo</span><span>− ${fmt(gasto)}</span></div>
    <div class="insight ${fim>=0?'good':'warn'}" style="margin-top:12px">${fim>=0?`Se continuar assim, você chega até ${ate} com <b>sobra de ${fmt(fim)}</b>.`:`Se continuar assim, vão <b>faltar ${fmt(-fim)}</b> até ${ate}. Para fechar certo, o dia precisaria custar no máximo <b>${fmt(maxDia)}</b>.`}</div></div>`;
}

// ---- tratamento de erros ----
function syErrKind(e){
  const msg=String((e&&(e.message||e.error_description))||e||'');
  if(e&&e.code==='SESSION_EXPIRED') return 'expired';
  if(typeof navigator!=='undefined' && navigator.onLine===false) return 'network';
  if((e&&e.name==='AuthRetryableFetchError') || /failed to fetch|networkerror|network request failed|load failed|fetch failed/i.test(msg)) return 'network';
  if((e&&(e.status===401||e.code==='PGRST301'||e.code==='PGRST303')) || /jwt|token.*expired|not authenticated|invalid.*(token|jwt)|refresh.?token/i.test(msg)) return 'auth';
  return 'other';
}
function syAuthMsg(e){
  const m=String((e&&e.message)||e||'');
  if(/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/email not confirmed/i.test(m)) return 'Esse e-mail ainda não foi confirmado. Abra o link que enviamos por e-mail.';
  if(/rate limit|too many/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/password should be at least|weak/i.test(m)) return 'A senha é fraca ou curta demais. Use pelo menos 8 caracteres.';
  if(syErrKind(e)==='network') return 'Sem conexão com a internet. Tente de novo quando estiver online.';
  return 'Não foi possível concluir: '+m;
}
function syHandleError(e){
  console.error('[Cofre sync]', e);
  const k=syErrKind(e);
  if(k==='network'){ syStatus('offline'); return; }
  if(k==='expired'){ sy.ready=false; syStatus('expired'); syOpen('login','Sua sessão expirou. Entre de novo para continuar sincronizando. Os dados deste aparelho continuam preservados.','warn'); return; }
  sy.lastError=(e&&e.message)||String(e); syStatus('error');
}
// executa uma chamada; se o token expirou, tenta renovar a sessão uma vez
async function syCall(fn){
  try{ return await fn(); }
  catch(e){
    if(syErrKind(e)!=='auth') throw e;
    let r; try{ r=await sy.client.auth.refreshSession(); }catch(e2){ r={error:e2}; }
    if(r&&r.data&&r.data.session){ sy.session=r.data.session; return await fn(); }
    if(r&&r.error&&syErrKind(r.error)==='network') throw r.error;
    const err=new Error('Sessão expirada'); err.code='SESSION_EXPIRED'; throw err;
  }
}

async function syFetchRemote(){
  const uid=sy.session.user.id;
  const r=await sy.client.from(SYNC_CONFIG.table).select('payload,updated_at').eq('user_id',uid).maybeSingle();
  if(r.error) throw r.error;
  return r.data||null;
}
function syReady(){ sy.ready=true; sy.paused=false; sy.pending=null; syMetaSet({lastSyncAt:new Date().toISOString()}); syStatus('synced'); }
function syPend(kind,row){ sy.paused=true; sy.ready=false; sy.pending={kind,row}; syStatus('paused'); syOpen(kind==='upload'?'upload':kind==='blocked'?'blocked':'conflict'); }

// aplica na tela/armazenamento local os dados vindos da nuvem (guarda cópia do que existia antes)
async function syApply(row){
  sySafetyCopy('antes-de-carregar-da-nuvem');
  const keepLocal={}; SY_LOCAL_SETTINGS.forEach(k=>{ if(state.settings&&state.settings[k]!==undefined) keepLocal[k]=state.settings[k]; });
  const defPrefs=()=>({order:['chart','categories','categoriesIncome','commitments','projections'],collapsed:{}});
  state = Object.assign({ bills:[], dashboardPrefs:defPrefs() }, row.payload);
  if(!state.dashboardPrefs) state.dashboardPrefs = defPrefs();
  if(Object.keys(keepLocal).length){ state.settings=Object.assign({},state.settings||{},keepLocal); }
  migrateDashboardOrder(); migrateCategoryTypes(); state.bills = migrateBills(state.bills);
  ui.selectedTx = [];
  try{ await storageSet('cofre-state', JSON.stringify(state)); }catch(e){ console.error('erro ao salvar localmente', e); syToast('Aviso: não consegui gravar localmente os dados da nuvem.'); }
  syMetaSet({ userId:sy.session.user.id, baseUpdatedAt:row.updated_at, baseHash:syHash(sySnap()), baseHadData:syHasData(state) });
  syReady(); render();
}

// ---- reconciliação inicial (ao entrar / abrir o app já logado) ----
async function syReconcile(){
  if(sy.reconciling||!sy.session) return;
  sy.reconciling=true; syStatus('syncing');
  try{
    const uid=sy.session.user.id;
    const row=await syCall(()=>syFetchRemote());
    const meta=syMeta();
    const linked = meta.userId===uid && !!meta.baseUpdatedAt;
    const localHas=syHasData(state);
    const localDirty = linked ? meta.baseHash!==syHash(sySnap()) : localHas;

    if(!row){
      if(!localHas){ syMetaSet({userId:uid,baseUpdatedAt:null,baseHash:syHash(sySnap()),baseHadData:false}); syReady(); }
      else syPend('upload',null);
      return;
    }
    if(!syValid(row.payload) && !syIsEmptyPayload(row.payload)){
      sy.paused=true; sy.ready=false; sy.pending=null;
      sy.lastError='Os dados na nuvem estão num formato inesperado. Nada foi alterado, nem aqui nem na nuvem.';
      syStatus('error'); syOpen('info',sy.lastError,'warn'); return;
    }
    const remoteHas = syValid(row.payload) && syHasData(row.payload);
    if(!remoteHas){
      if(!localHas){ syMetaSet({userId:uid,baseUpdatedAt:row.updated_at,baseHash:syHash(sySnap()),baseHadData:false}); syReady(); }
      else syPend('upload',row);
      return;
    }
    if(!localHas){
      if(linked && localDirty) syPend('blocked',row);   // pode ter sido uma limpeza proposital: não restaura nem apaga sozinho
      else await syApply(row);                          // aparelho novo/vazio: apenas carrega, nada é perdido
      return;
    }
    // os dois lados têm dados
    if(!linked){
      if(syStable(syState())===syStable(row.payload)){ syMetaSet({userId:uid,baseUpdatedAt:row.updated_at,baseHash:syHash(sySnap()),baseHadData:true}); syReady(); }
      else syPend('first',row);
      return;
    }
    if(row.updated_at===meta.baseUpdatedAt){ syReady(); if(localDirty) syQueuePush(0); return; }
    if(!localDirty){ await syApply(row); syToast('Dados atualizados a partir da nuvem.'); return; }
    syPend('diverged',row);
  }catch(e){ syHandleError(e); }
  finally{ sy.reconciling=false; }
}

// ---- envio (push) com concorrência otimista via updated_at ----
function syQueuePush(delay){ clearTimeout(sy.pushTimer); sy.pushTimer=setTimeout(()=>{ syPush(false); }, delay==null?1500:delay); }
function syAfterSave(){ if(!sy.session||!sy.ready||sy.paused) return; if(!syDirty()) return; syQueuePush(); }
async function syPush(force){
  if(sy.pushing){ sy.pushAgain=true; return; }
  if(!sy.client||!sy.session||!sy.ready||sy.paused) return;
  const uid=sy.session.user.id, meta=syMeta(), snap=sySnap(), hash=syHash(snap);
  if(!force && meta.userId===uid && meta.baseHash===hash){ if(sy.status!=='synced') syStatus('synced'); return; }
  if(!force && !syHasData(state)){
    if(meta.baseHadData){ syPend('blocked',null); return; }           // PROTEÇÃO: nunca enviar estado vazio por cima de dados
    syMetaSet({userId:uid,baseHash:hash}); if(sy.status!=='synced') syStatus('synced'); return;   // nada de valor para enviar
  }
  sy.pushing=true; syStatus('syncing');
  try{
    const now=new Date().toISOString(), payload=JSON.parse(snap), table=SYNC_CONFIG.table;
    const r=await syCall(async()=>{
      let q;
      if(!meta.baseUpdatedAt) q=await sy.client.from(table).insert({user_id:uid,payload,updated_at:now}).select('updated_at').single();
      else q=await sy.client.from(table).update({payload,updated_at:now}).eq('user_id',uid).eq('updated_at',meta.baseUpdatedAt).select('updated_at');
      if(q.error && q.error.code!=='23505') throw q.error;
      return q;
    });
    let ts=null;
    if(!r.error){ ts = Array.isArray(r.data) ? (r.data[0]&&r.data[0].updated_at) : (r.data&&r.data.updated_at); }
    if(!ts){ await syConflictFromPush(); return; }   // 0 linhas atualizadas (ou chave duplicada) = outro aparelho mudou a nuvem
    syMetaSet({userId:uid,baseUpdatedAt:ts,baseHash:hash,baseHadData:syHasData(payload),lastSyncAt:now});
    syStatus('synced');
  }catch(e){ syHandleError(e); }
  finally{
    sy.pushing=false;
    if(sy.pushAgain){ sy.pushAgain=false; syQueuePush(300); }
    else if(sy.ready&&!sy.paused&&sy.session&&sy.status==='synced'&&syDirty()) syQueuePush(300);
  }
}
async function syConflictFromPush(){
  const row=await syCall(()=>syFetchRemote());
  if(!row){ syMetaSet({baseUpdatedAt:null}); syPend('upload',null); return; }
  syPend('diverged',row);
}

// ---- verificação periódica: busca mudanças feitas em outros aparelhos ----
async function syCheckRemote(force){
  if(!sy.client||!sy.session||!sy.ready||sy.paused||sy.pushing||sy.checking) return;
  if(!force && (ui.modal||ui.confirmBox||sy.panel)) return;     // nunca troca os dados enquanto você edita algo
  sy.checking=true;
  try{
    const uid=sy.session.user.id;
    const r=await syCall(async()=>{ const q=await sy.client.from(SYNC_CONFIG.table).select('updated_at').eq('user_id',uid).maybeSingle(); if(q.error) throw q.error; return q; });
    const meta=syMeta();
    if(r.data && r.data.updated_at!==meta.baseUpdatedAt){
      const row=await syCall(()=>syFetchRemote());
      if(!row) return;
      if(!syValid(row.payload)){ sy.lastError='A nuvem tem dados em formato inesperado; nada foi alterado.'; syStatus('error'); return; }
      if(!force && (ui.modal||ui.confirmBox||sy.panel)) return;
      if(!syDirty()){ await syApply(row); syToast('Dados atualizados a partir de outro aparelho.'); }
      else syPend('diverged',row);
      return;
    }
    if(sy.status!=='synced' && !syDirty()) syStatus('synced');
  }catch(e){ syHandleError(e); }
  finally{ sy.checking=false; }
}
function syTick(){
  if(!sy.client||!sy.session||sy.paused||sy.reconciling||sy.pushing) return;
  if(!sy.ready){ syReconcile(); return; }
  if(syDirty()) syPush(false); else syCheckRemote(false);
}

// ---- decisões do usuário (conflito / primeiro envio / proteção contra vazio) ----
async function syChooseCloud(){
  const p=sy.pending; if(!p||!p.row) return;
  if(!syValid(p.row.payload)){ syOpen('info','Os dados da nuvem estão num formato inesperado; não é seguro carregá-los.','warn'); return; }
  sySafetyCopy('antes-de-escolher-a-nuvem');
  await syApply(p.row); syClose(); syToast('Pronto: este aparelho agora usa os dados da nuvem.');
}
async function syChooseLocal(){
  const p=sy.pending; if(!p) return;
  if(!confirm('Isto vai SUBSTITUIR os dados da nuvem pelos deste aparelho. Os outros aparelhos passarão a ver estes dados. Uma cópia do que estava na nuvem fica guardada aqui. Continuar?')) return;
  if(p.row && syValid(p.row.payload)) sySafetyCopy('nuvem-antes-de-substituir', p.row.payload);
  syMetaSet({ userId:sy.session.user.id, baseUpdatedAt:p.row?p.row.updated_at:null, baseHash:'x', baseHadData:true });
  sy.ready=true; sy.paused=false; sy.pending=null; syClose();
  await syPush(true);
}
function syLater(){ syClose(); }
async function syNow(){
  if(!sy.session){ syOpen('login'); return; }
  if(sy.pending){ syOpenPanel(); return; }
  if(sy.pushing||sy.reconciling) return;
  if(!sy.ready){ await syReconcile(); }
  else { await syPush(false); await syCheckRemote(true); }
  if(sy.panel==='account') syRenderPanel();
}

// ---- autenticação ----
function syVal(id){ const el=document.getElementById(id); return el?el.value:''; }
function syLockPanel(){ const L=document.getElementById('syncLayer'); if(L&&L.querySelectorAll) L.querySelectorAll('button').forEach(b=>{ b.disabled=true; }); }
async function syLogin(ev){
  if(ev) ev.preventDefault();
  if(sy.busy||!sy.client) return;
  const email=syVal('syEmail').trim(), password=syVal('syPass'); sy.emailDraft=email;
  if(!email||!password){ syOpen('login','Digite e-mail e senha.','warn'); return; }
  sy.busy=true; syLockPanel();
  try{
    const r=await sy.client.auth.signInWithPassword({email,password});
    if(r.error) throw r.error;
    sy.session=r.data.session; sy.paused=false; sy.pending=null; sy.ready=false; sy.busy=false;
    syClose(); syReconcile();
  }catch(e){ sy.busy=false; syOpen('login',syAuthMsg(e),'warn'); }
}
async function sySignUp(){
  if(sy.busy||!sy.client) return;
  const email=syVal('syEmail').trim(), password=syVal('syPass'); sy.emailDraft=email;
  if(!email||password.length<8){ syOpen('login','Para criar a conta, digite o e-mail e uma senha com pelo menos 8 caracteres.','warn'); return; }
  sy.busy=true; syLockPanel();
  try{
    const r=await sy.client.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0].split('?')[0]}});
    if(r.error) throw r.error;
    sy.busy=false;
    if(r.data&&r.data.user&&Array.isArray(r.data.user.identities)&&r.data.user.identities.length===0){ syOpen('login','Esse e-mail já tem conta. Use "Entrar".','warn'); return; }
    if(r.data&&r.data.session){ sy.session=r.data.session; sy.paused=false; sy.pending=null; sy.ready=false; syClose(); syReconcile(); }
    else syOpen('login','Conta criada. Enviamos um e-mail de confirmação: abra o link e depois volte aqui para entrar.','good');
  }catch(e){ sy.busy=false; syOpen('login',syAuthMsg(e),'warn'); }
}
async function syForgot(){
  const email=syVal('syEmail').trim(); sy.emailDraft=email;
  if(!email){ syOpen('login','Digite seu e-mail acima e toque em "Esqueci a senha" de novo.','warn'); return; }
  try{
    const r=await sy.client.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0].split('?')[0]});
    if(r.error) throw r.error;
    syOpen('login','Se esse e-mail tiver conta, você receberá um link para criar uma nova senha.','good');
  }catch(e){ syOpen('login',syAuthMsg(e),'warn'); }
}
async function syNewPassword(ev){
  if(ev) ev.preventDefault();
  const p=syVal('syNewPass');
  if(p.length<8){ syOpen('recovery','Use pelo menos 8 caracteres.','warn'); return; }
  try{
    const r=await sy.client.auth.updateUser({password:p});
    if(r.error) throw r.error;
    syClose(); syToast('Senha alterada.'); if(!sy.ready&&sy.session) syReconcile();
  }catch(e){ syOpen('recovery',syAuthMsg(e),'warn'); }
}
async function syLogout(){
  if(!confirm('Sair desta conta? Os dados continuam salvos neste aparelho, mas deixam de sincronizar até você entrar de novo.')) return;
  try{ await sy.client.auth.signOut({scope:'local'}); }catch(e){}
  clearTimeout(sy.pushTimer); sy.session=null; sy.ready=false; sy.pending=null; sy.paused=false;
  syStatus('signedout'); syClose();
}
function syOnAuth(event,session){
  sy.session=session||null;
  if(event==='SIGNED_OUT'){ sy.ready=false; sy.pending=null; sy.paused=false; if(sy.status!=='expired') syStatus('signedout'); return; }
  if(event==='PASSWORD_RECOVERY'){ setTimeout(()=>syOpen('recovery'),0); return; }
  if((event==='SIGNED_IN'||event==='INITIAL_SESSION') && session && !sy.ready && !sy.reconciling && !sy.paused) setTimeout(()=>syReconcile(),0);
}

// ---- painel (camada própria, fora do #app: render() não apaga o que você digita) ----

function syOpen(view,msg,type){ sy.panel=view; sy.panelMsg=msg||''; sy.panelType=type||''; syRenderPanel(); }
function syClose(){ sy.panel=null; sy.panelMsg=''; syRenderPanel(); }
function syOpenPanel(){
  if(sy.pending){ const k=sy.pending.kind; syOpen(k==='upload'?'upload':k==='blocked'?'blocked':'conflict'); }
  else if(!sy.client){ syOpen('info', sy.lastError||'A sincronização não está disponível agora. Recarregue a página quando estiver online.','warn'); }
  else if(!sy.session||sy.status==='expired') syOpen('login');
  else syOpen('account');
}

async function syBlockedRestore(){
  try{ const row=await syCall(()=>syFetchRemote()); if(!row||!syValid(row.payload)){ syOpen('info','Não consegui ler os dados da nuvem agora.','warn'); return; } sy.pending={kind:'blocked',row}; await syApply(row); syClose(); syToast('Dados da nuvem restaurados neste aparelho.'); }
  catch(e){ syClose(); syHandleError(e); }
}
async function syBlockedForce(){
  if(!confirm('Isto vai ESVAZIAR também os dados da nuvem (e dos outros aparelhos). Tem certeza?')) return;
  try{
    const row=await syCall(()=>syFetchRemote());
    if(row&&syValid(row.payload)) sySafetyCopy('nuvem-antes-de-esvaziar', row.payload);
    syMetaSet({ userId:sy.session.user.id, baseUpdatedAt:row?row.updated_at:null, baseHash:'x' });
    sy.ready=true; sy.paused=false; sy.pending=null; syClose(); await syPush(true);
  }catch(e){ syHandleError(e); }
}

// ---- inicialização ----
async function syInit(){
  if(!syConfigured()) return;                                  // sem configuração: Cofre 100% local, nada muda
  if(!(window.supabase&&window.supabase.createClient)){ sy.lastError='A biblioteca de sincronização não carregou (talvez sem internet). Recarregue a página quando estiver online. O Cofre continua funcionando neste aparelho.'; syStatus('offline'); return; }
  sy.client=window.supabase.createClient(SYNC_CONFIG.url,SYNC_CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sy.client.auth.onAuthStateChange((event,session)=>{ try{ syOnAuth(event,session); }catch(e){ console.error(e); } });
  syStatus('syncing');
  let session=null;
  try{ const r=await sy.client.auth.getSession(); session=r&&r.data?r.data.session:null; }
  catch(e){ syHandleError(e); }
  if(session){ sy.session=session; syReconcile(); }
  else if(sy.status!=='offline'){ syStatus('signedout'); if(!sy.gateShown){ sy.gateShown=true; syOpen('login'); } }
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible') syTick();
    else if(sy.session&&sy.ready&&!sy.paused&&syDirty()){ clearTimeout(sy.pushTimer); syPush(false); }
  });
  window.addEventListener('online',()=>{ syTick(); });
  window.addEventListener('offline',()=>{ if(sy.session) syStatus('offline'); });
  setInterval(syTick,45000);
}

// ===== Atualização automática: ao abrir (ou voltar ao app), confere se existe versão nova e recarrega =====
// Só roda quando o app está num endereço http(s). Não recarrega se você está editando algo.
(function(){
  if(!/^https?:$/.test(location.protocol)) return;
  const metaV=d=>{ const m=d.querySelector('meta[name="cofre-version"]'); return m?m.content:null; };
  const myV=metaV(document);
  let checking=false;
  async function checkUpdate(){
    if(checking||!myV) return; checking=true;
    try{
      const base=location.origin+location.pathname;
      const r=await fetch(base+'?cv='+Date.now(),{cache:'no-store'});
      if(!r.ok) return;
      const doc=new DOMParser().parseFromString(await r.text(),'text/html');
      const newV=metaV(doc);
      if(!newV||newV===myV) return;
      let tried=null; try{ tried=sessionStorage.getItem('cofre-upd-tried'); }catch(e){}
      if(tried===newV) return;                                        // já tentou esta versão nesta sessão: evita laço de recarga
      const busy=(window.ui&&(window.ui.modal||window.ui.confirmBox))||(typeof sy!=='undefined'&&(sy.panel||sy.pushing||(sy.session&&sy.ready&&!sy.paused&&syDirty())));
      if(busy){ setTimeout(()=>{ checking=false; checkUpdate(); },15000); return; }
      try{ sessionStorage.setItem('cofre-upd-tried',newV); }catch(e){}
      location.replace(base+'?v='+encodeURIComponent(newV));
    }catch(e){ /* sem internet: segue com a versão atual */ }
    finally{ checking=false; }
  }
  setTimeout(checkUpdate,2500);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
  setInterval(checkUpdate,300000);
})();

loadState().then(()=>{ try{ syInit(); }catch(e){ console.error(e); } });
</script>
