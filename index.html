<style>
  :root{
    --bg:#eef1f4;
    --surface:#ffffff;
    --surface-2:#f6f7f9;
    --border:#e3e7ec;
    --ink:#0e1620;
    --muted:#69737e;
    --brand:#0b4d3d;
    --brand-2:#0f6b52;
    --brand-soft:#e3efe9;
    --gold:#c8952c;
    --gold-soft:#faf1de;
    --green:#12805c;
    --green-soft:#e5f4ee;
    --red:#d1453b;
    --red-soft:#fbeae8;
    --shadow: 0 1px 2px rgba(14,22,32,.04), 0 6px 20px rgba(14,22,32,.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:960px;margin:0 auto;padding:22px 18px 100px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  header h1{font-family:'Fraunces',serif;font-size:23px;font-weight:700;margin:0;letter-spacing:-.3px;}
  header .sub{font-size:11px;color:var(--muted);letter-spacing:.4px;}
  nav{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  nav button{font-family:'Inter';font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:8px 15px;border-radius:22px;cursor:pointer;transition:.15s;}
  nav button.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
  .card-head-left{display:flex;align-items:center;gap:8px;}
  .card-actions{display:flex;align-items:center;gap:4px;}
  .icon-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);}
  .icon-btn:hover{color:var(--ink);}
  .hero{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-2) 100%);border-radius:20px;padding:26px 24px;color:#fff;margin-bottom:14px;box-shadow:var(--shadow);}
  .hero .label{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:1px;}
  .hero .balance{font-family:'IBM Plex Mono';font-size:38px;font-weight:600;margin:4px 0 16px;letter-spacing:-1px;}
  .hero .pills{display:flex;gap:10px;flex-wrap:wrap;}
  .pill{background:rgba(255,255,255,.14);border-radius:12px;padding:9px 14px;flex:1;min-width:120px;}
  .pill .plabel{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.5px;}
  .pill .pval{font-family:'IBM Plex Mono';font-size:16px;font-weight:600;margin-top:2px;}
  h2{font-family:'Fraunces',serif;font-size:17px;margin:0;font-weight:600;}
  h3{font-family:'Fraunces',serif;font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;padding:6px 8px;border-bottom:1.5px solid var(--border);}
  td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
  td.num{font-family:'IBM Plex Mono';text-align:right;white-space:nowrap;}
  .tag{display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:12px;background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
  .paytag{font-size:10px;color:var(--muted);}
  .row-actions{display:flex;gap:4px;}
  .row-actions button{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}
  .row-actions button:hover{color:var(--ink);}
  input,select,textarea{font-family:'Inter';font-size:14px;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--ink);width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-2);outline-offset:-1px;}
  textarea{font-family:'IBM Plex Mono';font-size:12px;min-height:120px;}
  label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .btn{font-family:'Inter';font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);}
  .btn-danger{background:var(--red);color:#fff;}
  .btn:disabled{opacity:.55;cursor:default;}
  .fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#241a05;border:none;cursor:pointer;box-shadow:0 8px 20px rgba(200,149,44,.4);z-index:50;display:flex;align-items:center;justify-content:center;}
  .modal-bg{position:fixed;inset:0;background:rgba(14,22,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow:auto;}
  .modal h2{margin-bottom:16px;}
  .seg{display:flex;gap:8px;margin-bottom:14px;}
  .seg button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600;font-size:13px;}
  .seg button.active.income{background:var(--green-soft);border-color:var(--green);color:var(--green);}
  .seg button.active.expense{background:var(--red-soft);border-color:var(--red);color:var(--red);}
  .empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:13.5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .month-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .month-nav button{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .month-nav .cur{font-family:'IBM Plex Mono';font-weight:600;font-size:14.5px;min-width:120px;text-align:center;}
  .commit-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono';font-size:13px;}
  .footer-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px;}
  .preview-table{max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:10px;margin-top:10px;}
  .insight{border-left:3px solid var(--gold);background:var(--gold-soft);padding:11px 14px;border-radius:0 10px 10px 0;font-size:13.5px;margin-bottom:10px;line-height:1.5;}
  .insight.warn{border-color:var(--red);background:var(--red-soft);}
  .insight.good{border-color:var(--green);background:var(--green-soft);}
  .barchart{display:flex;align-items:flex-end;gap:12px;height:150px;padding-top:10px;overflow-x:auto;}
  .barchart .col{flex:0 0 auto;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .barchart .bars{display:flex;gap:3px;align-items:flex-end;height:120px;}
  .barchart .bar{width:13px;border-radius:4px 4px 0 0;}
  .barchart .bar.projected{opacity:.4;background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(255,255,255,.5) 3px,rgba(255,255,255,.5) 5px);}
  .barchart .mlabel{font-size:10px;color:var(--muted);margin-top:6px;font-family:'IBM Plex Mono';white-space:nowrap;}
  .hbar-track{background:var(--surface-2);border-radius:5px;height:9px;overflow:hidden;margin-top:4px;}
  .hbar-fill{height:100%;border-radius:5px;}
  .drop-zone{border:1.5px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:12px;background:var(--surface-2);}
  .drop-zone.drag{border-color:var(--gold);background:var(--gold-soft);}
  .tabs-sub{display:flex;gap:6px;margin-bottom:14px;}
  .tabs-sub button{font-size:12px;padding:6px 13px;border-radius:16px;border:1px solid var(--border);background:#fff;cursor:pointer;}
  .tabs-sub button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .reorder-controls{display:flex;flex-direction:column;gap:2px;}
  .reorder-controls button{background:none;border:none;cursor:pointer;color:var(--muted);padding:1px;}
  .reorder-controls button:hover{color:var(--ink);}
  .reorder-controls button:disabled{opacity:.25;cursor:default;}
  .checkbox-row input[type=checkbox]{width:auto;}

  /* ===== Tema Auro: creme, verde-floresta, dourado ===== */
  :root{
    --bg:#f5f2ec; --surface:#ffffff; --surface-2:#f8f5ef; --border:#e9e4d9;
    --ink:#0a2a1d; --muted:#6a7a71;
    --brand:#0b4d3d; --brand-2:#0f6b52; --brand-deep:#042a1d; --brand-soft:#e6f1ec;
    --gold:#b0903f; --gold-soft:#f6efdc;
    --shadow:0 1px 2px rgba(4,42,29,.04),0 22px 44px -18px rgba(4,42,29,.16);
    --serif:'Instrument Serif','Fraunces',serif;
  }
  body{background:var(--bg);}
  .app{max-width:980px;padding-top:14px;}
  header{position:sticky;top:10px;z-index:40;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:9px 10px 9px 24px;box-shadow:var(--shadow);margin-bottom:22px;}
  .wordmark{font-family:var(--serif);font-style:italic;font-size:34px;line-height:1;color:var(--brand);letter-spacing:-.5px;}
  header .sub{display:none;}
  .hdr-cta{background:var(--brand-deep);color:#fff;border:none;border-radius:999px;padding:11px 20px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Inter';}
  nav{gap:8px;}
  nav button{border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.7);padding:9px 17px;}
  nav button.active{background:var(--brand-deep);border-color:var(--brand-deep);}
  .card{border-radius:26px;border:1px solid rgba(233,228,217,.7);padding:24px;box-shadow:var(--shadow);}
  h2{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.2px;}
  h3{font-family:var(--serif);font-weight:400;font-size:18px;}
  .btn{border-radius:999px;} .btn-primary{background:var(--brand-deep);}
  input,select,textarea{border-radius:12px;}
  .modal{border-radius:26px;} .modal h2{font-size:26px;}
  .fab{background:var(--brand-deep);color:#fff;box-shadow:0 14px 30px -8px rgba(4,42,29,.5);}
  td.num,.commit-row,.month-nav .cur{font-family:'Inter';font-variant-numeric:tabular-nums;}
  .month-nav .cur{font-family:var(--serif);font-size:22px;font-weight:400;}
  .month-nav button{border-radius:999px;}
  .insight{border-radius:0 14px 14px 0;border-left-color:var(--gold);}
  .hbar-track{height:7px;background:#eee9de;}
  th,label{letter-spacing:.14em;}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .eyebrow:before,.eyebrow:after{content:"";height:1px;width:34px;background:var(--gold);opacity:.7;}
  .resumo{padding:30px 28px;}
  .resumo .big{font-family:var(--serif);font-size:clamp(46px,9vw,68px);line-height:1;color:var(--brand-deep);letter-spacing:-1px;}
  .resumo .big.neg{color:#a8402f;}
  .resumo .lead{font-size:15.5px;line-height:1.65;color:var(--ink);margin:16px 0 0;max-width:62ch;}
  .resumo .lead b{color:var(--brand);font-weight:600;}
  .resumo em{font-family:var(--serif);font-size:1.15em;color:var(--gold);}
  .resumo .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
  .kpi{flex:1;min-width:130px;background:var(--surface-2);border-radius:16px;padding:12px 16px;}
  .kpi .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  .kpi .v{font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;}
  .donut-wrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .donut-wrap svg{flex:0 0 auto;}
  .legend{flex:1;min-width:200px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px 22px;font-size:13px;}
  .legend span.p{font-weight:700;margin-left:4px;}
  .legend .dot{margin-right:7px;}
  .goal{display:flex;align-items:center;gap:18px;padding:16px;border-radius:20px;background:var(--surface-2);margin-bottom:10px;}
  .goal .gname{font-size:15px;font-weight:600;}
  .goal .gval{font-family:var(--serif);font-size:28px;line-height:1.1;}
  .goal .gval small{font-family:'Inter';font-size:12px;color:var(--muted);}
  .goal .gsub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .goal .gbtns{margin-left:auto;display:flex;gap:6px;}
  .chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--brand);}
  .chip.x{color:var(--muted);}

  /* ===== Fundo: gravura ao fundo, estilo Auro ===== */

 x1='753' y1='330' x2='753' y2='400'/%3E%3Crect x='786' y='225' width='30' height='70'/%3E%3Cpath d='M786 225 Q801 211 816 225'/%3E%3Cline x1='801' y1='225' x2='801' y2='295'/%3E%3Crect x='786' y='330' width='30' height='70'/%3E%3Cpath d='M786 330 Q801 316 816 330'/%3E%3Cline x1='801' y1='330' x2='801' y2='400'/%3E%3Cpath d='M180 470 H880 M165 482 H895 M150 494 H910 M135 506 H925'/%3E%3C/g%3E%3C/svg%3E") no-repeat right -60px bottom 0/auto 100%;opacity:.42;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to top,#000 35%,transparent 100%);mask-image:linear-gradient(to top,#000 35%,transparent 100%);}

  /* ===== Chat ===== */
  .chatlog{display:flex;flex-direction:column;gap:12px;margin:14px 0;max-height:420px;overflow:auto;}
  .chatlog:empty:before{content:"Pergunte algo ou toque em uma sugestão.";color:var(--muted);font-size:13.5px;}
  .msg{font-size:14.5px;line-height:1.6;max-width:92%;}

async function storageGet(key){
  if(window.storage){
    const r = await window.storage.get(key, false);
    return r ? r.value : null;
  }
  return localStorage.getItem(key);

async function storageSet(key, value){

      if(!state.dashboardPrefs) state.dashboardPrefs = {order:['chart','categories','categoriesIncome','commitments','projections'],collapsed:{}};
      migrateDashboardOrder();
      migrateCategoryTypes();
      state.bills = migrateBills(state.bills);
    }
  }catch(e){ /* sem dados salvos ainda */ }
  render();
}
function migrateCategoryTypes(){
  state.categories.forEach(c=>{ if(!c.type) c.type = 'expense'; });
  if(!state.categories.some(c=>c.name==='Outros' && c.type==='income')){
    state.categories.push({name:'Outros', type:'income', color:'#69737e', keywords:[]});
  }
}
function migrateDashboardOrder(){
  const order = state.dashboardPrefs.order;
  if(!order.includes('categoriesIncome')){
    const i = order.indexOf('categories');
    order.splice(i>-1 ? i+1 : order.length, 0, 'categoriesIncome');

}

// ---------- utilidades ----------
function uid(){ return Math.random().toString(36).slice(2,10); }
function fmtRaw(n){ return (n<0?'-':'') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function monthLabel(ym){ const [y,m] = ym.split('-'); return MONTHS[parseInt(m,10)-1] + ' / ' + y; }
function shiftMonth(ym, delta){
  let [y,m] = ym.split('-').map(Number);
  m += delta;
  while(m>12){m-=12;y++;}
  while(m<1){m+=12;y--;}
  return y + '-' + String(m).padStart(2,'0');
}
function normalizeStr(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function isValidIsoDate(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  const [y,m,d] = iso.split('-').map(Number);
  return y>=2000 && y<=2100 && m>=1 && m<=12 && d>=1 && d<=31;
}
function parseNumberBR(v){
  if(typeof v === 'number') return v;
  let s = String(v).replace(/R\$/gi,'').trim();
  if(s==='') return NaN;
  if(s.includes(',')){ s = s.replace(/\./g,'').replace(',', '.'); }
  return parseFloat(s);
}
function guessCategory(desc, type){
  const d = normalizeStr(desc);
  let best = null, bestLen = -1;
  for(const c of state.categories){
    if(c.type && c.type!==type) continue;
    for(const kw of c.keywords){
      if(!kw) continue;
      const nk = normalizeStr(kw);
      if(nk && d.includes(nk) && nk.length > bestLen){ best = c.name; bestLen = nk.length; }
    }
  }
  return best || 'Outros';
}
function catColor(name, type){
  const c = state.categories.find(c=>c.name===name && (!type || !c.type || c.type===type));
  return c ? c.color : '#69737e';
}
function categoriesOfType(type){ return state.categories.filter(c=>c.type===type); }
function detectPaymentMethod(rawDesc){
  const d = normalizeStr(rawDesc);
  if(d.includes('pix')) return 'Pix';
  if(d.includes('debito')) return 'Cartão de débito';
  if(d.includes('credito')) return 'Cartão de crédito';
  if(d.includes('boleto')) return 'Boleto';
  if(d.includes(' ted') || d.includes(' doc') || d.startsWith('ted') || d.startsWith('doc')) return 'TED/DOC';
  if(d.includes('saque') || d.includes('dinheiro')) return 'Dinheiro';
  return 'Outro';
}
function cleanDescription(rawDesc){
  let s = rawDesc || '';
  s = s.replace(/Transferência\s+(recebida|enviada)(\s+pelo\s+Pix)?\s*-?\s*/i,'');
  s = s.replace(/Compra\s+no\s+(débito|debito|crédito|credito)(\s+via\s+NuPay)?\s*-?\s*/i,'');
  s = s.replace(/Pagamento\s+de\s+boleto\s+efetuado\s*-?\s*/i,'');
  s = s.split(/\s+(Agência|Agencia|Ag\.|Conta:|CPF|CNPJ)/i)[0];
  s = s.split(' - ')[0];
  return s.trim() || 'Lançamento';
}
function extractKeyword(desc){
  return normalizeStr(cleanDescription(desc)).slice(0,40);
}

function askConfirm(message, onYes){ ui.confirmBox = {message, onYes}; render(); }
function resolveConfirm(yes){
  const cb = ui.confirmBox && ui.confirmBox.onYes;
  ui.confirmBox = null; render();
  if(yes && cb) cb();
}

function learnFromCorrection(desc, category, type){
  if(category==='Outros') return;
  if(guessCategory(desc, type)===category) return;
  const kw = extractKeyword(desc);
  if(kw && kw.length>=3){
    const cat = state.categories.find(c=>c.name===category && (!type || !c.type || c.type===type));
    if(cat && !cat.keywords.some(k=>normalizeStr(k)===normalizeStr(kw))) cat.keywords.push(kw);
  }
}
function cleanupEmptyAutoCategories(){
  state.categories = state.categories.filter(c=>{
    if(!c.auto) return true;
    return state.transactions.some(t=>t.category===c.name && t.type===c.type);
  });
}
function findOrphanTransactions(){ return state.transactions.filter(t=>!isValidIsoDate(t.date)); }

function parseExtractText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const results = [];
  const dateRe = /(\d{2}\/\d{2}\/\d{4}|\d{2}\/\d{2})/;
  for(const line of lines){
    const dm = line.match(dateRe);
    if(!dm) continue;
    let dateStr = dm[0];
    if(dateStr.length===5) dateStr += '/' + ui.month.slice(0,4);
    const [dd,mm,yyyy] = dateStr.split('/');
    const ddN=parseInt(dd,10), mmN=parseInt(mm,10), yyyyN=parseInt(yyyy,10);
    if(!ddN||!mmN||ddN<1||ddN>31||mmN<1||mmN>12||yyyyN<2000||yyyyN>2100) continue;
    const iso = yyyy + '-' + mm + '-' + dd;

    const lineNoDate = line.replace(dm[0], '');
    const numMatches = lineNoDate.match(/-?\d[\d.,]*\d|-?\d+/g);
    if(!numMatches || !numMatches.length) continue;
    const rawVal = numMatches[numMatches.length-1];
    const val = parseNumberBR(rawVal);
    if(isNaN(val) || val===0) continue;

    const isNeg = lineNoDate.trim().startsWith('-') || lineNoDate.includes('-'+rawVal) || lineNoDate.includes('- '+rawVal);
    let rawDesc = lineNoDate.replace(rawVal,'').replace(/^-|R\$/gi,'').trim();
    const paymentMethod = detectPaymentMethod(rawDesc);
    const desc = cleanDescription(rawDesc);
    const type = (val < 0 || isNeg) ? 'expense' : 'income';
    results.push({ id: uid(), date: iso, desc, paymentMethod, amount: Math.abs(val), type, category: guessCategory(desc, type) });
  }
  return results;
}

function detectDelimiter(text){
  const firstLine = (text.split(/\r?\n/)[0] || '');
  const commas = (firstLine.match(/,/g)||[]).length;
  const semicolons = (firstLine.match(/;/g)||[]).length;
  return semicolons > commas ? ';' : ',';
}
function looksLikeCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(Boolean).slice(0,6);
  if(lines.length<2) return false;
  const delim = detectDelimiter(text);
  const counts = lines.map(l=>l.split(delim).length);
  const consistent = counts.every(c=>c===counts[0]) && counts[0]>=2;
  const headerLower = lines[0].toLowerCase();
  const looksHeader = headerLower.includes('data') && (headerLower.includes('valor') || headerLower.includes('descri'));
  return consistent && (looksHeader || counts[0]>=3);
}
function parseCSVRaw(text, delimiter){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === delimiter){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field='';
        if(!(row.length===1 && row[0]==='')) rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim()));
}
function parseCsvText(text){
  const delimiter = detectDelimiter(text);
  const rows = parseCSVRaw(text, delimiter);
  return rowsToTransactions(rows);
}
function excelValueToDate(v){
  if(typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    return d.y + '-' + String(d.m).padStart(2,'0') + '-' + String(d.d).padStart(2,'0');
  }
  const s = String(v).trim();
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let [_,dd,mm,yy] = m; if(yy.length===2) yy = '20'+yy; return yy + '-' + mm.padStart(2,'0') + '-' + dd.padStart(2,'0'); }
  const m2 = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m2) return m2[1]+'-'+m2[2].padStart(2,'0')+'-'+m2[3].padStart(2,'0');
  return null;
}
function findHeaderInfo(rows){
  let headerRowIdx=-1, colDate=-1, colDesc=-1, colVal=-1, colIn=-1, colOut=-1;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const row = rows[i].map(c=>String(c).toLowerCase());
    const dIdx = row.findIndex(c=>c.includes('data')||c.includes('date'));
    const descIdx = row.findIndex(c=>c.includes('descri')||c.includes('histor')||c.includes('lança')||c.includes('titulo')||c.includes('estabelecimento'));
    const vIdx = row.findIndex(c=>(c.includes('valor')||c.includes('amount')||c.includes('montante')) && !c.includes('saldo'));
    const inIdx = row.findIndex(c=>c.includes('entrada')||c.includes('crédito')||c.includes('credito'));
    const outIdx = row.findIndex(c=>c.includes('saída')||c.includes('saida')||c.includes('débito')||c.includes('debito'));
    if(dIdx>-1 && (vIdx>-1 || (inIdx>-1 && outIdx>-1))){
      headerRowIdx=i; colDate=dIdx; colDesc=descIdx; colVal=vIdx; colIn=inIdx; colOut=outIdx;
      break;
    }
  }
  return {headerRowIdx, colDate, colDesc, colVal, colIn, colOut};
}
function guessColumnsByContent(rows){
  const sample = rows.slice(0, Math.min(rows.length,25));
  const ncols = Math.max(1, ...sample.map(r=>r.length));
  const dateScore = new Array(ncols).fill(0);
  const numScore = new Array(ncols).fill(0);
  const textLen = new Array(ncols).fill(0);
  sample.forEach(row=>{
    for(let c=0;c<ncols;c++){
      const v = row[c];
      if(v===undefined || v==='') continue;
      const s = String(v);
      if(/\d{1,2}\/\d{1,2}\/\d{2,4}/.test(s) || (typeof v==='number' && v>20000 && v<60000)) dateScore[c]++;
      if(!isNaN(parseNumberBR(v)) && /\d/.test(s) && !/\//.test(s)) numScore[c]++;
      textLen[c] += s.length;
    }
  });
  let colDate = 0, bestD=-1;
  for(let c=0;c<ncols;c++){ if(dateScore[c]>bestD){ bestD=dateScore[c]; colDate=c; } }
  let colVal = -1, bestV=-1;
  for(let c=0;c<ncols;c++){ if(c!==colDate && numScore[c]>bestV){ bestV=numScore[c]; colVal=c; } }
  let colDesc = -1, bestLen=-1;
  for(let c=0;c<ncols;c++){ if(c!==colDate && c!==colVal && textLen[c]>bestLen){ bestLen=textLen[c]; colDesc=c; } }
  if(colDesc===-1) colDesc = colVal===1?2:1;
  if(colVal===-1) colVal = colDesc===2?1:2;
  return {colDate, colDesc, colVal};
}
function rowsToTransactions(rows){
  const info = findHeaderInfo(rows);
  const results = [];
  if(info.headerRowIdx>-1){
    for(let i=info.headerRowIdx+1;i<rows.length;i++){
      const row = rows[i];
      if(!row || row.length<2) continue;
      const dateRaw = row[info.colDate];
      if(dateRaw===undefined || dateRaw==='') continue;
      const date = excelValueToDate(dateRaw);
      if(!isValidIsoDate(date)) continue;
      const rawDesc = String(info.colDesc>-1 ? row[info.colDesc] : 'Lançamento').trim() || 'Lançamento';
      const paymentMethod = detectPaymentMethod(rawDesc);
      const desc = cleanDescription(rawDesc);
      if(info.colVal>-1){
        const rawVal = row[info.colVal];
        if(rawVal===undefined || rawVal==='' || isNaN(parseNumberBR(rawVal))) continue;
        const val = parseNumberBR(rawVal);
        if(!val) continue;
        results.push({ id: uid(), date, desc, paymentMethod, amount: Math.abs(val), type: val<0?'expense':'income', category: guessCategory(desc, val<0?'expense':'income') });
      } else if(info.colIn>-1 && info.colOut>-1){
        const inVal = parseNumberBR(row[info.colIn]);
        const outVal = parseNumberBR(row[info.colOut]);
        if(inVal && !isNaN(inVal)) results.push({ id: uid(), date, desc, paymentMethod, amount: Math.abs(inVal), type:'income', category: guessCategory(desc,'income') });
        if(outVal && !isNaN(outVal)) results.push({ id: uid(), date, desc, paymentMethod, amount: Math.abs(outVal), type:'expense', category: guessCategory(desc,'expense') });
      }
    }
  } else {
    const g = guessColumnsByContent(rows);
    for(let i=0;i<rows.length;i++){
      const row = rows[i];
      if(!row || row.length<2) continue;
      const rawVal = row[g.colVal];
      if(rawVal===undefined || rawVal==='' || isNaN(parseNumberBR(rawVal))) continue;
      const val = parseNumberBR(rawVal);
      if(!val) continue;
      const dateRaw = row[g.colDate];
      if(dateRaw===undefined || dateRaw==='') continue;
      const date = excelValueToDate(dateRaw);
      if(!isValidIsoDate(date)) continue;
      const rawDesc = String(row[g.colDesc]||'Lançamento').trim();
      results.push({ id: uid(), date, desc: cleanDescription(rawDesc), paymentMethod: detectPaymentMethod(rawDesc), amount: Math.abs(val), type: val<0?'expense':'income', category: guessCategory(cleanDescription(rawDesc), val<0?'expense':'income') });
    }
  }
  return results;
}
async function parseExcelFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:false});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
  return rowsToTransactions(rows);
}

async function parsePdfFile(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let fullText = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const items = content.items.map(it=>({str: it.str, x: it.transform[4], y: it.transform[5]}));
    items.sort((a,b)=> b.y - a.y || a.x - b.x);
    const TOL = 3;
    let lines = [], curLine = [], curY = null;
    for(const it of items){
      if(!it.str.trim()) continue;
      if(curY===null || Math.abs(it.y-curY) <= TOL){ curLine.push(it); if(curY===null) curY = it.y; }
      else { lines.push(curLine.sort((a,b)=>a.x-b.x).map(o=>o.str).join(' ')); curLine=[it]; curY=it.y; }
    }
    if(curLine.length) lines.push(curLine.sort((a,b)=>a.x-b.x).map(o=>o.str).join(' '));
    fullText += lines.join('\n') + '\n';
  }
  if(!fullText.trim()){
    throw new Error('Este PDF parece ser uma imagem escaneada — não consigo extrair texto dele. Tente exportar em CSV/Excel ou colar o texto manualmente.');
  }
  return { text: fullText, transactions: parseExtractText(fullText) };
}

async function callAIExtractBatch(textChunk, categoryNames){

async function extractPdfWithAI(){

async function handleImportFiles(fileList){
  const files = Array.from(fileList);
  const combined = []; const errors = [];
  ui.rawPdfText = null;
  for(const file of files){
    try{
      const ext = file.name.split('.').pop().toLowerCase();
      let results;
      if(ext==='pdf'){
        const parsed = await parsePdfFile(file);
        ui.rawPdfText = (ui.rawPdfText ? ui.rawPdfText + '\n' : '') + parsed.text;
        results = parsed.transactions;
      }
      else if(ext==='xlsx' || ext==='xls') results = await parseExcelFile(file);
      else if(ext==='csv'){ const text = await file.text(); results = parseCsvText(text); }
      else { const text = await file.text(); results = parseExtractText(text); }
      combined.push(...results);
    }catch(err){ errors.push(file.name + ': ' + (err.message || 'não consegui ler esse arquivo.')); }
  }
  ui.importPreview = combined;
  render();
  if(errors.length) alert('Atenção com estes arquivos:\n\n' + errors.join('\n'));
}

  const txs = txInMonth(m);

  const expense = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);

}
function monthsBetween(a,b){
  const [ay,am] = a.split('-').map(Number); const [by,bm] = b.split('-').map(Number);
  return (by-ay)*12 + (bm-am);
}
function getPurchaseInstallmentAmount(p, month){
  const base = (p.installmentValue !== undefined) ? p.installmentValue : (p.total/p.installments);
  return (p.amountOverrides && p.amountOverrides[month]!==undefined) ? p.amountOverrides[month] : base;
}
function monthlyCommitment(purchase, ym){

  if(idx < 0 || idx >= purchase.installments) return 0;
  return getPurchaseInstallmentAmount(purchase, ym);
}
function totalCommitmentForMonth(ym){

const RAMP = ['#042a1d','#0b4d3d','#12805c','#3a9e7e','#8cc5b2','#c3ddd2'];
function rk(name){ return (window.__rk && window.__rk[name]) || catColor(name,'expense'); }
function pct(n){ return Math.round(n*100); }
function expenseRows(m){
  const by = {};
  txInMonth(m).filter(t=>t.type==='expense').forEach(t=>{ by[t.category]=(by[t.category]||0)+t.amount; });
  return Object.entries(by).sort((a,b)=>b[1]-a[1]);
}
function donutSvg(rows, total, size){
  const r=42, C=2*Math.PI*r; let off=0;
  const segs = rows.map(([n,v],i)=>{
    const len=v/total*C, col=(window.__rk&&window.__rk[n])||RAMP[RAMP.length-1];
    const s=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="17" stroke-dasharray="${Math.max(len-1.6,0.5)} ${C-Math.max(len-1.6,0.5)}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off+=len; return s;
  }).join('');
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}">${segs}
    <text x="60" y="56" text-anchor="middle" font-size="7" letter-spacing="1.2" fill="#6a7a71">TOTAL</text>
    <text x="60" y="69" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0a2a1d">${fmt(total)}</text></svg>`;
}
function widgetCategories(){
  const rows = expenseRows();

  window.__rk = {}; rows.forEach(([n],i)=>{ window.__rk[n] = RAMP[Math.min(i,RAMP.length-1)]; });
  const total = rows.reduce((s,r)=>s+r[1],0);
  const top = rows.slice(0,5), rest = rows.slice(5).reduce((s,r)=>s+r[1],0);
  const legendRows = rest>0 ? [...top, ['Demais', rest]] : top;
  const legend = legendRows.map(([n,v],i)=>`<div><span class="dot" style="background:${i<5?RAMP[i]:'#aab3ae'}"></span>${n}<span class="p">${pct(v/total)}%</span></div>`).join('');

}

function ringSvg(p, size){

window.__chat = window.__chat || [];
const SUGESTOES = ['Como está minha vida financeira?','Onde mais gastei?','Quanto fica comprometido nos próximos meses?','Onde posso economizar?','Quanto posso gastar esta semana?'];
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(t){ return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function catMap(m){ const o={}; expenseRows(m).forEach(([n,v])=>o[n]=v); return o; }
function oportunidades(){
  const cur=catMap(ui.month), prev=catMap(shiftMonth(ui.month,-1)), out=[];
  Object.keys(cur).forEach(n=>{ if(prev[n]>0 && cur[n]>prev[n]*1.1) out.push({n, d:cur[n]-prev[n], p:(cur[n]-prev[n])/prev[n]}); });

function chatAnswer(q){
  const n=norm(q), ml=monthLabel(ui.month);
  const _t=tetoAnswer(n); if(_t) return _t;
  const cur=monthTotals(ui.month), prev=monthTotals(shiftMonth(ui.month,-1));

  const vazio = !txInMonth().length;
  if(/^(sim|quero|ver|mostra)/.test(n) || /econom|cortar|reduzir|enxugar/.test(n)){
    const o=oportunidades();
    if(!o.length) return 'Neste mês nenhuma categoria subiu mais de 10% em relação ao anterior. Sem alertas por enquanto.';
    return `Encontrei <b>${o.length}</b> ${o.length>1?'categorias que subiram':'categoria que subiu'} em relação ao mês anterior:<hr>`+o.map(x=>`<b>${x.n}</b>: +${fmt(x.d)} (${pct(x.p)}% a mais)`).join('<br>')+'<hr>Vale olhar os lançamentos dessas categorias primeiro.';
  }
  if(/vida financeira|como (estou|esta|ta|anda)|resumo|panorama/.test(n)){
    if(vazio) return `Ainda não há lançamentos em <b>${ml}</b>. Adicione ou importe o extrato e eu monto o resumo.`;
    let h = cur.balance>=0 ? `Está no caminho: em <b>${ml}</b> sobraram <b>${fmt(cur.balance)}</b>${cur.income>0?` (${pct(cur.balance/cur.income)}% do que entrou)`:''}. ` : `Atenção: em <b>${ml}</b> faltaram <b>${fmt(-cur.balance)}</b> para fechar o mês. `;
    h += 'Seus gastos ficaram assim:';
    if(rows.length) h += '<hr>'+chatDonut(rows,total)+'<hr>';
    const nx=totalCommitmentForMonth(shiftMonth(ui.month,1));
    if(nx>0) h += `O mês que vem já tem <b>${fmt(nx)}</b> comprometidos. `;
    const g=(state.goals||[])[0];
    if(g && g.target>0) h += `Sua meta <b>${esc(g.name)}</b> está em <b>${pct(g.saved/g.target)}%</b>. `;
    const o=oportunidades();
    if(o.length) h += `Encontrei <b>${o.length}</b> oportunidades de economia, gostaria de ver?`;
    return h;
  }
  if(/sobrou|saldo|fechou|faltou/.test(n)){
    if(vazio) return `Sem lançamentos em ${ml} ainda.`;
    return `Em <b>${ml}</b>: entradas de <b>${fmt(cur.income)}</b>, saídas de <b>${fmt(cur.expense)}</b>, saldo de <b>${fmt(cur.balance)}</b>.`;
  }
  const cats=state.categories.filter(c=>c.type==='expense').sort((a,b)=>b.name.length-a.name.length);
  const hit=cats.find(c=>n.includes(norm(c.name)));
  if(hit && /quanto|gast/.test(n)){

    return `Em <b>${ml}</b> você gastou <b>${fmt(v)}</b> em <b>${hit.name}</b>${total>0?` (${pct(v/total)}% das saídas)`:''}.${pv>0?` No mês anterior foram ${fmt(pv)}.`:''}`;
  }
  if(/onde|maior|mais gast|categoria|gastei/.test(n)){
    if(!rows.length) return `Sem gastos lançados em ${ml}.`;
    return `Seus maiores gastos em <b>${ml}</b>:<hr>`+rows.slice(0,5).map(([c,v])=>`<b>${c}</b>: ${fmt(v)} (${pct(v/total)}%)`).join('<br>');
  }
  if(/compromet|parcela|cartao|proximos|futuro|vem/.test(n)){
    const l=[1,2,3].map(i=>{ const m=shiftMonth(ui.month,i); return `<b>${monthLabel(m)}</b>: ${fmt(totalCommitmentForMonth(m))}`; });
    return 'Comprometido em parcelas e contas nos próximos meses:<hr>'+l.join('<br>');
  }
  if(/meta|objetivo|guardar/.test(n)){
    const gs=state.goals||[];
    if(!gs.length) return 'Você ainda não tem metas. Crie uma no card <b>Metas</b>, com valor e prazo.';
    return gs.map(g=>{ const left=Math.max(0,g.target-g.saved); return `<b>${esc(g.name)}</b>: ${fmt(g.saved)} de ${fmt(g.target)} (${pct(g.saved/g.target)}%)`+(left>0?`. Guarde ${fmt(left/monthsUntil(g.deadline))}/mês até ${g.deadline.split('-').reverse().join('/')}.`:'. Meta alcançada!'); }).join('<hr>');
  }
  if(/mes passado|anterior|comparad/.test(n)){
    if(prev.expense<=0) return 'Não há dados suficientes do mês anterior para comparar.';
    const d=(cur.expense-prev.expense)/prev.expense;
    return `As saídas ${d>=0?'subiram':'caíram'} <b>${Math.abs(pct(d))}%</b> em relação ao mês anterior (${fmt(prev.expense)} → ${fmt(cur.expense)}).`;
  }
  return 'Ainda não entendi essa pergunta. Posso falar sobre: <b>como está sua vida financeira</b>, <b>onde mais gastou</b>, <b>quanto gastou em uma categoria</b>, <b>parcelas comprometidas</b>, <b>metas</b>, <b>comparação com o mês anterior</b> e <b>onde economizar</b>.';
}

function projModel(){
  const months=[...new Set(state.transactions.map(t=>t.date.slice(0,7)))].sort();
  const hist=months.filter(m=>m<ui.month).slice(-((state.settings||{}).months||3));
  if(!hist.length) return null;

  return `<div class="plan">${h}</div>`;
}

function tetoList(m){ return state.bills.filter(b=>billApplies(b,m)&&(state.tetoBills||[]).includes(b.id)); }

function tetoPicker(){
  const bs=state.bills.filter(b=>billApplies(b,ui.month)); if(!bs.length) return '';
  return `<details style="margin-top:12px"><summary class="gsub" style="cursor:pointer">Escolher quais contas são tetos de gasto</summary><div class="chips" style="margin-top:8px">${bs.map(b=>`<button class="chip ${(state.tetoBills||[]).includes(b.id)?'on':''}" data-id="${b.id}" onclick="toggleTeto(this.dataset.id)">${esc(b.name)}</button>`).join('')}</div></details>`;
}
function tetoGasto(b,m){
  const ex=new Set(); state.bills.forEach(x=>{const e=(x.paidMonths||{})[m]; if(e&&e.txId) ex.add(e.txId);});
  state.cards.forEach(c=>c.purchases.forEach(p=>{const e=(p.paidMonths||{})[m]; if(e&&e.txId) ex.add(e.txId);}));
  const nb=norm(b.name);
  return txInMonth(m).filter(t=>t.type==='expense'&&!ex.has(t.id)).filter(t=>{
    const cat=state.categories.find(c=>c.name===t.category&&c.type==='expense');
    return norm(t.category)===nb||norm(t.desc||'').includes(nb)||(cat&&(cat.keywords||[]).some(k=>k.length>2&&(norm(k)===nb||nb.includes(norm(k)))));

}
function diaRecebe(){

  let w=0,a=0; state.transactions.filter(t=>t.type==='income'&&ms.includes(t.date.slice(0,7))).forEach(t=>{ w+=t.amount*Number(t.date.slice(8,10)); a+=t.amount; });

function tetoAnswer(n){
  const intent=/gast|posso|resta|teto|semana|sobr/.test(n);

  const named=bs.filter(b=>norm(b.category).length>2&&n.includes(norm(b.category)));
  if(named.length&&intent) return named.map(tetoLinha).join('<hr>');
  if(/posso gastar|por semana|essa semana|esta semana|orcamento|limites|quanto (me )?resta/.test(n)){
    if(!bs.length) return 'Você ainda não definiu orçamentos. Abra a aba <b>Orçamentos</b> e crie um limite, por exemplo para Mercado.';
    const r=ritmo(), tot=bs.reduce((a,b)=>a+Math.max(0,budgetState(b,ui.month).rest),0);
    return `Seus orçamentos em <b>${monthLabel(ui.month)}</b>:<hr>`+bs.map(tetoLinha).join('<hr>')+(r?`<hr>Somando tudo, dá <b>${fmt(tot/r.days*7)}/semana</b>.`:'');
  }
  return null;
}


// ===== Fixo x variável =====
function moveBillToBudget(id){
  const b=state.bills.find(x=>x.id===id); if(!b) return;
  const names=[...new Set(state.categories.filter(c=>c.type==='expense').map(c=>c.name))];
  let cat=names.find(x=>norm(x)===norm(b.name));
  if(!cat){ const nm=prompt('Em qual categoria os gastos de "'+b.name+'" são lançados? Escolha uma:\n'+names.join(', ')); if(!nm) return; cat=names.find(x=>norm(x)===norm(nm.trim())); if(!cat){ alert('Categoria não encontrada.'); return; } }
  if(budgetsOf().some(x=>x.category===cat)){ alert('Já existe orçamento para '+cat+'. Edite o limite na lista acima.'); return; }
  const v=getBillAmount(b,ui.month);
  if(!confirm('Mover "'+b.name+'" para Orçamentos como limite de '+cat+' ('+fmt(v)+'/mês)? Ela sai da lista de contas a pagar.')) return;
  state.budgets=state.budgets||[]; state.budgets.push({id:'o'+Date.now(),category:cat,amount:v}); b.variable=true; saveState(); render();
}
function restoreBill(id){ const b=state.bills.find(x=>x.id===id); if(!b) return; b.variable=false; saveState(); render(); }
function orcamentosView(){
  const live=state.bills.filter(b=>billApplies(b,ui.month)), moved=state.bills.filter(b=>b.variable);
  const rows=live.map(b=>`<div class="commit-row"><span>${esc(b.name)} <small style="color:var(--muted)">${fmt(getBillAmount(b,ui.month))}</small></span><button class="chip" data-id="${b.id}" onclick="moveBillToBudget(this.dataset.id)">É variável: mover para Orçamentos</button></div>`).join('');
  const back=moved.map(b=>`<div class="commit-row"><span>${esc(b.name)}</span><button class="chip x" data-id="${b.id}" onclick="restoreBill(this.dataset.id)">Voltar para contas a pagar</button></div>`).join('');
  return orcamentosViewBase()+`<div class="card"><h2>Contas a pagar: fixas ou variáveis?</h2><p class="gsub">Contas a pagar devem ter só custos fixos, pagos de uma vez (aluguel, escola). O que vai sendo gasto aos poucos (mercado, delivery) é variável e fica em Orçamentos.</p>${rows||'<div class="empty">Nenhuma conta a pagar neste mês.</div>'}${back?`<div class="gsub" style="margin-top:14px">Já movidas:</div>${back}`:''}</div>`;
}


// ===== Contas a pagar (lembrete) x Orçamento (controle) + dia de recebimento =====
function billLink(b){ if(b.noLink) return null; const bs=budgetsOf(); if(b.budgetCat&&bs.some(x=>x.category===b.budgetCat)) return b.budgetCat; const nb=norm(b.name), hit=bs.find(x=>norm(x.category)===nb); return hit?hit.category:null; }
function linkBill(id){ const b=state.bills.find(x=>x.id===id), bs=budgetsOf(); if(!b) return; if(!bs.length){ alert('Crie um orçamento primeiro.'); return; }
  const nm=prompt('O valor da conta "'+b.name+'" já está dentro de qual orçamento? Escolha:\n'+bs.map(x=>x.category).join(', ')); if(!nm) return;
  const hit=bs.find(x=>norm(x.category)===norm(nm.trim())); if(!hit){ alert('Orçamento não encontrado.'); return; }
  b.budgetCat=hit.category; b.noLink=false; saveState(); render(); }
function unlinkBill(id){ const b=state.bills.find(x=>x.id===id); if(!b) return; b.budgetCat=null; b.noLink=true; saveState(); render(); }
function aindaCai(m){
  if(m<curMonth()) return {contas:0,parcelas:0,orc:0};
  const contas=state.bills.filter(b=>billApplies(b,m)&&!isBillPaid(b,m)&&!billLink(b)).reduce((a,b)=>a+getBillAmount(b,m),0);
  let parcelas=0; state.cards.forEach(c=>c.purchases.forEach(p=>{ if(!isPaidEntry((p.paidMonths||{})[m])) parcelas+=monthlyCommitment(p,m); }));
  const orc=budgetsOf().reduce((a,b)=>a+Math.max(0,budgetState(b,m).rest),0);
  return {contas,parcelas,orc};
}
function paydayWindow(){
  const o=state.payday; if(o&&o.from&&o.to) return {from:o.from,to:o.to,manual:true};
  const ms=[...new Set(state.transactions.filter(t=>t.type==='income').map(t=>t.date.slice(0,7)))].sort().slice(-((state.settings||{}).months||3)), days=[];
  ms.forEach(m=>{ const inc=state.transactions.filter(t=>t.type==='income'&&t.date.slice(0,7)===m), mx=Math.max(...inc.map(t=>t.amount)); inc.filter(t=>t.amount>=mx*0.25).forEach(t=>days.push(Number(t.date.slice(8,10)))); });
  return days.length?{from:Math.min(...days),to:Math.max(...days),manual:false}:null;
}
function setPayday(){
  const v=prompt('Entre quais dias do mês você costuma receber? Ex.: 5-8 (ou só um dia). Deixe vazio para o app detectar sozinho.'); if(v===null) return;
  if(v.trim()===''){ delete state.payday; } else { const m=v.match(/(\d{1,2})\D+(\d{1,2})/)||v.match(/(\d{1,2})/); if(!m) return; const a=Number(m[1]), b=Number(m[2]||m[1]); state.payday={from:Math.min(a,b),to:Math.max(a,b)}; }
  saveState(); render();
}
function ritmo(){
  const cm=curMonth(); if(ui.month!==cm) return null;
  const w=paydayWindow(), d=new Date().getDate(), dim=daysIn(cm), pd=w?w.to:null;
  const days=pd&&pd>d ? pd-d : pd ? dim-d+pd : dim-d+1;
  return {pd,from:w?w.from:null,days:Math.max(1,days)};
}
function tetoLinha(b){
  const s=budgetState(b,ui.month), r=ritmo();
  let h=`<div style="display:flex;gap:14px;align-items:center">${ringSvg(Math.min(1,s.p),64)}<div><b>${esc(b.category)}</b>: ${fmt(s.g)} de ${fmt(s.L)}<br>`;
  if(s.rest<0) h+=`Passou do limite em <b>${fmt(-s.rest)}</b>.`;
  else if(s.rest===0) h+=`Usou o limite total. Não sobrou nada.`;
  else { h+=`Restam <b>${fmt(s.rest)}</b>. `; h+= r?`Você costuma receber ${r.from&&r.from!==r.pd?`entre o dia ${r.from} e o dia ${r.pd}`:`no dia ${r.pd}`}. Contando até o dia ${r.pd}, são ${r.days} dia(s): dá <b>${fmt(s.rest/r.days)}/dia</b> ou <b>${fmt(s.rest/r.days*7)}/semana</b>.`:'(Por dia e por semana só no mês atual.)'; }
  return h+'</div></div>';
}
function orcamentosView(){
  const w=paydayWindow(), live=state.bills.filter(b=>billApplies(b,ui.month));
  const rows=live.map(b=>{ const l=billLink(b); return `<div class="commit-row"><span>${esc(b.name)} <small style="color:var(--muted)">${fmt(getBillAmount(b,ui.month))}${l?' · ligada ao orçamento '+esc(l):''}</small></span>${l?`<button class="chip x" data-id="${b.id}" onclick="unlinkBill(this.dataset.id)">Desligar</button>`:`<button class="chip" data-id="${b.id}" onclick="linkBill(this.dataset.id)">Ligar a um orçamento</button>`}</div>`; }).join('');
  return orcamentosViewBase()+`<div class="card"><h2>Dia em que você recebe</h2><p class="lead" style="font-size:14.5px;margin:10px 0">${w?`Você costuma receber ${w.from!==w.to?`entre o dia <b>${w.from}</b> e o dia <b>${w.to}</b>`:`no dia <b>${w.to}</b>`} (${w.manual?'definido por você':'detectado nos últimos 3 meses'}). A sugestão por dia e por semana conta os dias até o dia ${w.to}, o mais tarde, para o dinheiro não faltar.`:'Ainda não há entradas lançadas para eu detectar o seu dia de recebimento.'}</p><button class="chip" onclick="setPayday()">Ajustar dias</button></div>
  <div class="card"><h2>Contas a pagar e orçamentos</h2><p class="gsub">Contas a pagar são o seu lembrete do que vai sair e a estimativa do mês que vem. O orçamento acompanha quanto você já gastou e quanto ainda tem. Pode ter os dois com o mesmo valor, como Mercado R$ 1.800. Quando estão ligados, o Balanço conta só o que resta do orçamento, para não duplicar. Ligam sozinhos quando o nome é igual.</p>${rows||'<div class="empty">Nenhuma conta a pagar neste mês.</div>'}</div>`;
}

function linkedToBudget(id,cat){ const bl=state.bills.find(x=>x.id===id); return !!bl&&billLink(bl)===cat; }

// ===== Formulários no app (sem prompt/confirm nativos) e Configurações =====
function fmt(v){ return (state&&state.settings&&state.settings.hide)?'R$ ••••':fmtRaw(v); }
function openForm(title,fields,onOk,okLabel,note){ ui.modal={type:'form',title,fields,onOk,okLabel:okLabel||'Salvar',note:note||'',error:''}; render(); }
function submitForm(){
  const m=ui.modal, vals={};
  m.fields.forEach(f=>{ const el=document.getElementById('f_'+f.id); f.value=el?el.value:f.value; vals[f.id]=f.value; });
  const err=m.onOk(vals);
  if(err){ m.error=err; renderModal2(); return; }
  closeModal();
}
function parseMoney(s){ s=String(s||'').trim().replace(/[^\d,.\-]/g,''); if(!s) return 0; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); else if(!/^-?\d+\.\d{1,2}$/.test(s)) s=s.replace(/\./g,''); const n=parseFloat(s); return isNaN(n)?0:n; }
function addBudget(){
  const names=[...new Set(state.categories.filter(c=>c.type==='expense').map(c=>c.name))].filter(n=>!budgetsOf().some(b=>b.category===n));
  if(!names.length){ openForm('Novo orçamento',[],()=>null,'Ok','Todas as categorias de gasto já têm orçamento. Crie categorias novas em Configurações.'); return; }
  openForm('Novo orçamento',[{id:'cat',label:'Categoria',kind:'select',options:names,value:names[0]},{id:'amount',label:'Limite mensal (R$)',kind:'money',placeholder:'1.800,00'}],v=>{ const a=parseMoney(v.amount); if(a<=0) return 'Digite um valor maior que zero.'; state.budgets=state.budgets||[]; state.budgets.push({id:'o'+Date.now(),category:v.cat,amount:a}); saveState(); },'Criar');
}
function editBudget(id){ const b=budgetsOf().find(x=>x.id===id); if(!b) return; openForm('Limite de '+b.category,[{id:'amount',label:'Limite mensal (R$)',kind:'money',value:String(b.amount).replace('.',',')}],v=>{ const a=parseMoney(v.amount); if(a<=0) return 'Digite um valor maior que zero.'; b.amount=a; saveState(); }); }
function removeBudget(id){ const b=budgetsOf().find(x=>x.id===id); if(!b) return; askConfirm('Excluir o orçamento de <b>'+esc(b.category)+'</b>?',()=>{ state.budgets=budgetsOf().filter(x=>x.id!==id); saveState(); render(); }); }
function setSaldoInicial(){ const cur=(state.openingBalance||{})[ui.month]; openForm('Saldo inicial de '+monthLabel(ui.month),[{id:'v',label:'Saldo total no início do mês, conta + caixinhas (R$)',kind:'money',value:cur!==undefined?String(cur).replace('.',','):'',placeholder:'Vazio = calcular dos lançamentos'}],v=>{ state.openingBalance=state.openingBalance||{}; if(String(v.v).trim()==='') delete state.openingBalance[ui.month]; else state.openingBalance[ui.month]=parseMoney(v.v); saveState(); }); }
function setPayday(){ const w=state.payday||{}; openForm('Dia em que você recebe',[{id:'a',label:'Do dia (1 a 31)',kind:'number',value:w.from||''},{id:'b',label:'Até o dia (1 a 31)',kind:'number',value:w.to||''}],v=>{ if(!v.a&&!v.b){ delete state.payday; saveState(); return; } const a=Number(v.a||v.b), b=Number(v.b||v.a); if(!(a>=1&&a<=31&&b>=1&&b<=31)) return 'Use dias entre 1 e 31.'; state.payday={from:Math.min(a,b),to:Math.max(a,b)}; saveState(); },'Salvar','Deixe os dois campos vazios para o app detectar sozinho.'); }
function linkBill(id){ const b=state.bills.find(x=>x.id===id), bs=budgetsOf(); if(!b) return; if(!bs.length){ openForm('Ligar a um orçamento',[],()=>null,'Ok','Crie um orçamento primeiro, na aba Orçamentos.'); return; }
  const names=bs.map(x=>x.category); openForm('Ligar "'+b.name+'"',[{id:'c',label:'Esta conta já está dentro de qual orçamento?',kind:'select',options:names,value:names[0]}],v=>{ b.budgetCat=v.c; b.noLink=false; saveState(); }); }
function addGoal(){
  openForm('Nova meta',[{id:'name',label:'Nome da meta',kind:'text',placeholder:'Viagem para a Europa'},{id:'target',label:'Valor total (R$)',kind:'money',placeholder:'18.000,00'},{id:'saved',label:'Quanto você já guardou (R$)',kind:'money',value:'0'},{id:'deadline',label:'Prazo (mês e ano)',kind:'month',value:''}],v=>{

// ===== Meta semanal do ciclo (dentro do cartão do orçamento) =====
// O ciclo começa todo dia X (padrão 8) e vai até a véspera do próximo início. A semana vai de segunda a domingo.
// Toda semana que toca o ciclo conta como semana inteira. Estouro desconta da semana seguinte; sobra soma na seguinte ou é reajustada.
// state.weeklyGoals[categoria] = {on, amount, startDay, startOverride:{inicioAutomatico:inicioReal}, carry:'soma'|'reajusta'}
function wgISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function wgDate(s){ const p=String(s).slice(0,10).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function wgAdd(s,n){ const d=wgDate(s); d.setDate(d.getDate()+n); return wgISO(d); }
function wgMon(s){ const d=wgDate(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return wgISO(d); }
function wgBR(s){ return s.slice(8,10)+'/'+s.slice(5,7); }
function wgAuto(y,m0,S){ const f=new Date(y,m0,1), last=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(); return wgISO(new Date(f.getFullYear(),f.getMonth(),Math.min(S,last))); }
function wgGoals(){ state.weeklyGoals=state.weeklyGoals||{}; return state.weeklyGoals; }
function wgOn(cat){ const g=wgGoals()[cat]; return !!(g&&g.on&&g.amount>0); }
function wgCycle(g,today){
  const S=Math.min(31,Math.max(1,Number(g.startDay)||8)), o=g.startOverride||{}, t=wgDate(today), st=[];
  for(let k=-2;k<=2;k++){ const a=wgAuto(t.getFullYear(),t.getMonth()+k,S); st.push({auto:a,eff:o[a]||a}); }
  st.sort((x,y)=>x.eff.localeCompare(y.eff));
  let i=0; st.forEach((s,k)=>{ if(s.eff<=today) i=k; });
  const nat=wgAdd(st[i+1].eff,-1), eo=(g.endOverride||{})[st[i].auto], end=(eo&&eo>=today&&eo>=st[i].eff)?eo:nat;
  return {start:st[i].eff,end:end,nat:nat,auto:st[i].auto};
}
function wgSpent(cat,from,to){
  return state.transactions.filter(t=>t.type==='expense'&&t.category===cat&&t.date>=from&&t.date<=to&&!(t.linkedType==='bill'&&linkedToBudget(t.linkedBillId,cat))).reduce((a,t)=>a+t.amount,0);
}
function wgPlan(g,today){
  const c=wgCycle(g,today), weeks=[];
  for(let mon=wgMon(c.start);mon<=c.end;mon=wgAdd(mon,7)){ const sun=wgAdd(mon,6); weeks.push({mon,sun,from:mon<c.start?c.start:mon,to:sun>c.end?c.end:sun}); }
  const N=weeks.length, amount=Number(g.amount)||0, reaj=g.carry==='reajusta';
  let base=amount/N, carry=0, cur=0;
  weeks.forEach((w,i)=>{
    w.base=base; w.carry=carry; w.raw=base+carry; w.allow=Math.max(0,w.raw);
    w.spent=wgSpent(g.__cat,w.from,w.to); w.diff=w.raw-w.spent;
    if(today>=w.mon) cur=i;
    if(w.diff<0) carry=w.diff;
    else if(reaj){ const left=N-i-1; if(left>0) base+=w.diff/left; carry=0; }
    else carry=w.diff;
  });
  const spentTot=weeks.reduce((a,w)=>a+w.spent,0), left=Math.max(1,N-cur);
  return Object.assign(c,{weeks,N,cur,amount,spentTot,rest:amount-spentTot,ritmo:Math.max(0,(amount-spentTot)/left),next:weeks[cur+1]||null});
}
function wgBlock(b){
  const cat=b.category, g=wgGoals()[cat], c=esc(cat);
  if(!wgOn(cat)) return `<button class="obc-l" data-c="${c}" onclick="wgEdit(this.dataset.c)">+ Meta semanal do ciclo</button>`;
  const p=wgPlan(Object.assign({},g,{__cat:cat}),todayISO()), w=p.weeks[p.cur], left=w.allow-w.spent, over=left<0;
  const pc=w.allow>0?Math.min(100,Math.max(0,w.spent/w.allow*100)):(w.spent>0?100:0);
  const parts=w.carry>0.004?` (meta ${fmt(w.base)} + sobra ${fmt(w.carry)})`:w.carry<-0.004?` (meta ${fmt(w.base)} − estouro ${fmt(-w.carry)})`:'';
  const nxt=p.next?`<div class="wg-r"><span>Próxima semana, se parar por aqui</span><b>${fmt(Math.max(0,p.next.raw))}</b></div>`:'';
  return `<div class="wg${over?' over':''}"><div class="wg-h"><b>Meta da semana</b><span>${wgBR(w.from)} a ${wgBR(w.to)}</span></div>
    <div class="wg-big">${over?`Passou ${fmt(-left)}`:left===0&&w.allow>0?'Meta usada':`Restam ${fmt(left)}`}</div>
    <div class="wg-bar"><i style="width:${pc}%"></i></div>
    <div class="gsub">Gastou ${fmt(w.spent)} de ${fmt(w.allow)}${parts}${over?'. Isso desconta da próxima semana.':''}</div>
    <div class="wg-r"><span>Ritmo ajustado</span><b>${fmt(p.ritmo)}/semana</b></div>${nxt}
    <div class="wg-r"><span>Período ${wgBR(p.start)} a ${wgBR(p.end)}</span><b>${fmt(p.spentTot)} de ${fmt(p.amount)} · semana ${p.cur+1} de ${p.N}</b></div>
    ${wgNotice(b,g,p)}<button class="obc-l" data-c="${c}" onclick="wgEdit(this.dataset.c)">Ajustar meta</button></div>`;
}
function wgNotice(b,g,p){
  const pd=wgPending(g,b,p); if(!pd.ids.length||Math.abs(pd.net)<0.005) return '';
  const less=pd.net<0, c=esc(b.category);
  return `<div class="obc-x">Você ${less?'retirou':'repôs'} ${fmt(Math.abs(pd.net))} da caixinha neste período. ${less?'Diminuir':'Aumentar'} a meta?</div><div class="bx-act"><button class="chip" data-c="${c}" onclick="wgApplyCut(this.dataset.c)">${less?'Diminuir':'Aumentar'} a meta</button><button class="chip" data-c="${c}" onclick="wgIgnoreCut(this.dataset.c)">Manter</button></div>`;
}
function wgEdit(cat){
  const gs=wgGoals(), g=gs[cat]||{}, today=todayISO(), labS='Somar na semana seguinte', labR='Reajustar nas semanas que faltam';
  const isNew=!g.on, cy=wgCycle(g,today), mon=wgMon(today), defStart=(isNew&&mon>cy.start)?mon:cy.start;
  openForm('Meta semanal: '+cat,[
    {id:'amount',label:'Quanto você tem para gastar nesse período (R$)',kind:'money',value:g.amount?String(g.amount).replace('.',','):'',placeholder:'500,00'},
    {id:'start',label:'Contar os gastos a partir de',kind:'date',value:defStart},
    {id:'end',label:'Até (último dia do período)',kind:'date',value:cy.end},
    {id:'carry',label:'Se sobrar dinheiro na semana',kind:'select',options:[labS,labR],value:g.carry==='reajusta'?labR:labS},
    {id:'day',label:'Nos próximos ciclos, começar todo dia (1 a 31)',kind:'number',value:g.startDay||8}
  ],v=>{
    const amount=parseMoney(v.amount), day=Math.round(Number(v.day));
    if(!(amount>0)) return 'Digite quanto você tem para gastar, maior que zero.';
    if(!(day>=1&&day<=31)) return 'O dia do ciclo vai de 1 a 31.';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v.start||'')) return 'Escolha a data em que a contagem começa.';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v.end||'')) return 'Escolha o último dia do período.';
    if(v.end<v.start) return 'O último dia precisa ser depois do primeiro.';
    if(v.end<today) return 'O último dia não pode ser antes de hoje.';
    const same=(day===(Number(g.startDay)||8)), ov=same?Object.assign({},g.startOverride||{}):{}, eo=same?Object.assign({},g.endOverride||{}):{};
    if(v.start!==cy.start){
      const d=wgDate(v.start); let best=null;
      for(let k=-1;k<=1;k++){ const a=wgAuto(d.getFullYear(),d.getMonth()+k,day), dist=Math.abs(wgDate(a)-d); if(!best||dist<best.dist) best={a,dist}; }
      if(v.start===best.a) delete ov[best.a]; else ov[best.a]=v.start;
    }
    const c2=wgCycle({startDay:day,startOverride:ov},today);
    if(v.end!==c2.nat) eo[c2.auto]=v.end; else delete eo[c2.auto];
    gs[cat]={on:true,amount:amount,startDay:day,startOverride:ov,endOverride:eo,carry:v.carry===labR?'reajusta':'soma'};
    saveState();
  },'Salvar','');
  ui.modal.extra=`<div class="gsub" style="line-height:1.5"><b>Como funciona.</b> Você diz quanto tem para gastar e em qual período: o app conta só os gastos desta categoria entre as duas datas e divide o valor pelas semanas (segunda a domingo). Toda semana que toca o período conta como inteira. ${isNew?'As datas já vêm preenchidas com a segunda-feira desta semana até o fim do ciclo. Mude se quiser. ':''}Entradas de dinheiro não mexem na meta. Se passar da meta, o excesso sai da semana seguinte. Se sobrar, você escolhe: somar na semana seguinte, ou dividir a sobra entre as semanas que faltam. Os ciclos seguintes começam sozinhos no dia indicado no último campo.</div>${g.on?`<button class="btn btn-danger" style="margin-top:12px" onclick="closeModal();wgOff('${esc(cat).replace(/'/g,"\\'")}')">Desligar meta semanal</button>`:''}`;
  renderModal2();
}

function widgetShell(wid, idx, total, collapsed, innerHtml){
  return `

      <div class="card-head" onclick="toggleWidgetCollapse('${wid}')">
        <div class="card-head-left">
          <span style="color:var(--muted);">${collapsed?icon('chevronDown'):icon('chevronUp')}</span>

function toggleWidgetCollapse(wid){

}
function moveWidget(wid, dir){
  const order = state.dashboardPrefs.order;
  const i = order.indexOf(wid);
  const j = i + dir;
  if(j<0 || j>=order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  saveState(); render();
}
function widgetChart(){
  const monthsWithData = [...new Set(state.transactions.map(t=>t.date.slice(0,7)))].sort();
  const pastMonths = monthsWithData.filter(m=>m<=ui.month).slice(-5);
  if(!pastMonths.includes(ui.month) && txInMonth().length>0) pastMonths.push(ui.month);
  const pastTotals = pastMonths.map(m=>({m, ...monthTotals(m), projected:false}));

  const priorMonthsWithData = monthsWithData.filter(m=>m<ui.month);
  const histTotals = priorMonthsWithData.slice(-3).map(m=>monthTotals(m));
  let projTotals = [];
  if(histTotals.length){
    const avgIncome = histTotals.reduce((s,t)=>s+t.income,0)/histTotals.length;
    const avgExpense = histTotals.reduce((s,t)=>s+t.expense,0)/histTotals.length;
    for(let i=1;i<=3;i++){
      const m = shiftMonth(ui.month,i);
      projTotals.push({m, income:avgIncome, expense:projExpenseFor(m,avgExpense), projected:true});
    }
  }
  const all = [...pastTotals, ...projTotals];
  if(!all.length) return `<div class="empty">Nenhum lançamento ainda.</div>`;
  const maxVal = Math.max(1, ...all.map(p=>Math.max(p.income,p.expense)));
  return `
    <div class="barchart">
      ${all.map(p=>`
        <div class="col">
          <div class="bars">
            <div class="bar ${p.projected?'projected':''}" style="height:${Math.round(p.income/maxVal*120)}px;background:var(--green)" title="Entradas: ${fmt(p.income)}"></div>
            <div class="bar ${p.projected?'projected':''}" style="height:${Math.round(p.expense/maxVal*120)}px;background:var(--red)" title="Saídas: ${fmt(p.expense)}"></div>
          </div>
          <div class="mlabel">${p.m.slice(5)}/${p.m.slice(2,4)}${p.projected?'*':''}</div>
        </div>
      `).join('')}
    </div>
    <div style="display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;">
      <span><span class="dot" style="background:var(--green)"></span> Entradas</span>
      <span><span class="dot" style="background:var(--red)"></span> Saídas</span>
      ${projTotals.length ? '<span>* projeção (listrado)</span>' : ''}
    </div>
  `;
}

}

function widgetProjectionsOld(){
  const monthsWithData = [...new Set(state.transactions.map(t=>t.date.slice(0,7)))].sort();
  const histMonths = monthsWithData.filter(m=>m<ui.month).slice(-3);
  if(!histMonths.length){
    return `<div class="empty">Preciso de pelo menos um mês <em>anterior</em> lançado pra projetar.</div>`;
  }
  const histTotals = histMonths.map(m=>monthTotals(m));
  const avgIncome = histTotals.reduce((s,t)=>s+t.income,0)/histTotals.length;
  // separa o que já era "conhecido" (contas+cartão) do que sobrou de variável em cada mês passado
  const histVariable = histMonths.map(m=>Math.max(0, monthTotals(m).expense - knownCommittedForMonth(m)));
  const avgVariable = histVariable.reduce((s,v)=>s+v,0)/histVariable.length;

  const rows = [];
  for(let i=1;i<=3;i++){
    const m = shiftMonth(ui.month,i);
    const known = knownCommittedForMonth(m);
    const balance = avgIncome - known - avgVariable;
    rows.push({m, known, balance});
  }
  const worst = rows.reduce((a,b)=> b.balance<a.balance ? b : a, rows[0]);

  let html = `<p style="font-size:11px;color:var(--muted);margin:0 0 8px;">Entrada média (${histMonths.length} mês(es)): ${fmt(avgIncome)} • Variável médio (fora contas/cartão): ${fmt(avgVariable)}</p>`;
  html += `<table><thead><tr><th>Mês</th><th style="text-align:right">Contas+cartão</th><th style="text-align:right">Saldo projetado</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    html += `<tr><td>${monthLabel(r.m)}</td><td class="num">${fmt(r.known)}</td><td class="num" style="color:${r.balance<0?'var(--red)':'var(--green)'}">${fmt(r.balance)}</td></tr>`;
  });
  html += `</tbody></table>`;

  if(worst.balance < 0){
    html += `<div class="insight warn" style="margin-top:10px;">Atenção: <strong>${monthLabel(worst.m)}</strong> deve fechar negativo em cerca de <strong>${fmt(worst.balance)}</strong>.</div>`;
  }
  // visão anual: só o que já é certeza (contas fixas + parcelas já cadastradas), sem estimativa variável
  let known12 = 0;
  for(let i=1;i<=12;i++) known12 += knownCommittedForMonth(shiftMonth(ui.month,i));
  if(known12>0) html += `<p style="font-size:11px;color:var(--muted);margin-top:8px;">Já garantido (contas fixas + parcelas) pros próximos 12 meses: <strong>${fmt(known12)}</strong>.</p>`;

  let maxEnd = null;
  state.cards.forEach(c=>c.purchases.forEach(p=>{
    const [y,m] = p.startMonth.split('-').map(Number);
    let em = m + p.installments - 1, ey = y;
    while(em>12){em-=12;ey++;}
    const endYm = ey+'-'+String(em).padStart(2,'0');
    if(!maxEnd || endYm > maxEnd) maxEnd = endYm;
  }));
  if(maxEnd) html += `<p style="font-size:11px;color:var(--muted);margin-top:4px;">Parcelas de cartão devem zerar em <strong>${monthLabel(maxEnd)}</strong>.</p>`;
  return html;
}

function filteredTxInMonth(){
  const f = ui.txFilter;
  return txInMonth().filter(t=>{
    if(f.type==='moves') return false;
    if(f.type!=='all' && t.type!==f.type) return false;
    if(f.category!=='all' && (t.type+'::'+t.category)!==f.category) return false;
    if(f.search && !normalizeStr(t.desc).includes(normalizeStr(f.search))) return false;
    return true;
  });

// ===== Ordem da lista de lançamentos =====
// Padrão: data mais recente no topo. Dentro do mesmo dia, o que foi cadastrado por último aparece primeiro.
// "Últimos adicionados" ordena pela ordem de cadastro (um lançamento antigo cadastrado agora aparece no topo).
const TX_SORTS=[['date_desc','Data: mais recente primeiro'],['date_asc','Data: mais antiga primeiro'],['added_desc','Últimos adicionados primeiro'],['amount_desc','Maior valor primeiro'],['amount_asc','Menor valor primeiro']];
function txSortMode(){ const m=(state.settings||{}).txSort; return TX_SORTS.some(s=>s[0]===m)?m:'date_desc'; }
function sortTx(list){
  const idx=new Map(state.transactions.map((t,i)=>[t.id,i])), pos=t=>idx.has(t.id)?idx.get(t.id):0;
  const byDateDesc=(a,b)=>b.date.localeCompare(a.date)||pos(b)-pos(a);
  const m=txSortMode(), out=list.slice();
  if(m==='date_asc') out.sort((a,b)=>a.date.localeCompare(b.date)||pos(a)-pos(b));
  else if(m==='added_desc') out.sort((a,b)=>pos(b)-pos(a));
  else if(m==='amount_desc') out.sort((a,b)=>b.amount-a.amount||byDateDesc(a,b));
  else if(m==='amount_asc') out.sort((a,b)=>a.amount-b.amount||byDateDesc(a,b));
  else out.sort(byDateDesc);
  return out;
}

function billCategoryName(b){
  if(b.noLink) return null;
  const l = billLink(b);
  if(l) return l;
  const nb = norm(b.name);
  const c = state.categories.find(c=>c.type==='expense' && norm(c.name)===nb);
  return c ? c.name : null;
}
// quanto de cada conta já "saiu": marcada como paga = valor cheio; senão, o que foi lançado na categoria dela (limitado ao valor da conta)
function billPaidMap(bills, month){
  const pool={}, out={};
  txInMonth(month).forEach(t=>{ if(t.type==='expense' && !t.linkedType) pool[t.category]=(pool[t.category]||0)+t.amount; });
  bills.forEach(b=>{
    const amt=getBillAmount(b,month);
    if(isBillPaid(b,month)){ out[b.id]=amt; return; }
    const cat=billCategoryName(b);
    if(!cat||!pool[cat]){ out[b.id]=0; return; }
    const use=Math.min(amt,pool[cat]); pool[cat]-=use; out[b.id]=use;
  });
  return out;
}
function dupKey(a,b){ return [a.id,b.id].sort().join('|'); }
function findDuplicates(month){
  const ok=new Set(state.dupOk||[]);
  const txs=txInMonth(month).filter(t=>t.type==='expense');
  const words=s=>norm(s||'').split(/[^a-z0-9]+/).filter(w=>w.length>=4);
  const out=[];
  for(let i=0;i<txs.length;i++) for(let j=i+1;j<txs.length;j++){
    const a=txs[i], b=txs[j];
    if(Math.abs(a.amount-b.amount)>0.009) continue;
    if(Math.abs((new Date(a.date)-new Date(b.date))/86400000)>3) continue;
    const wb=words(b.desc);
    if(!(a.category===b.category || words(a.desc).some(w=>wb.includes(w)))) continue;
    if(ok.has(dupKey(a,b))) continue;
    out.push([a,b]);
  }
  return out;
}
function dupDismiss(a,b){ state.dupOk=state.dupOk||[]; state.dupOk.push([a,b].sort().join('|')); saveState(); render(); }
function dupSee(id){ const t=state.transactions.find(x=>x.id===id); ui.tab='lancamentos'; ui.txFilter={category:'all',type:'all',search:t?(t.desc||''):''}; render(); }

}

        <div class="pill" style="background:var(--red-soft);"><div class="plabel" style="color:var(--red);">Pendente</div><div class="pval" style="color:var(--red);">${fmt(pending)}</div></div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin:12px 0 0;">Saldo disponível real este mês: entradas (${fmt(totals.income)}) menos <strong>todas</strong> as saídas já lançadas em Lançamentos (${fmt(totals.expense)})${boxes().length?(dBox>=0?`, menos o que foi guardado nas caixinhas (${fmt(dBox)})`:`, mais o que foi usado de dentro das caixinhas (${fmt(-dBox)})`):''} = <strong>${fmt(saldoDisponivel)}</strong>. Isso já considera dinheiro gasto em outras coisas, não só as contas marcadas aqui.</p>
      ${pending>0 ? `<div class="insight ${falta>0?'warn':'good'}" style="margin-top:14px;">
        ${falta>0
          ? `Considerando o que já entrou e o que já saiu pra outras coisas este mês, ainda falta <strong>${fmt(falta)}</strong> pra cobrir as contas e parcelas de cartão pendentes.`
          : `O saldo disponível (${fmt(saldoDisponivel)}) já cobre as contas e parcelas pendentes — sobra <strong>${fmt(sobra)}</strong>.`}
      </div>` : ''}
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2>Contas e parcelas de ${monthLabel(ui.month)}</h2>

function saveBill(){

  const amount = parseFloat(document.getElementById('mBillAmount').value);
  const dueDay = parseInt(document.getElementById('mBillDue').value,10) || null;
  const recurring = document.getElementById('mBillRecurring').checked;
  const paymentMethod = document.getElementById('mBillPaymentMethod').value;
  if(!name || !amount){ alert('Preencha nome e valor.'); return; }
  if(!recurring && !ui.modal.months.length){ alert('Selecione pelo menos um mês, ou marque como recorrente.'); return; }
  if(ui.modal.edit){
    const b = state.bills.find(b=>b.id===ui.modal.edit);
    Object.assign(b, { name, amount, dueDay, recurring, paymentMethod, months: recurring ? [] : ui.modal.months.slice() });
    const overrideEl = document.getElementById('mBillMonthOverride');
    if(overrideEl){
      const raw = overrideEl.value;
      if(!b.amountOverrides) b.amountOverrides = {};
      if(raw === '') delete b.amountOverrides[ui.month];
      else b.amountOverrides[ui.month] = parseFloat(raw);
    }
    const pmOverrideEl = document.getElementById('mBillMonthPaymentOverride');
    if(pmOverrideEl){
      const raw = pmOverrideEl.value;
      if(!b.paymentMethodOverrides) b.paymentMethodOverrides = {};
      if(raw === '') delete b.paymentMethodOverrides[ui.month];
      else b.paymentMethodOverrides[ui.month] = raw;
    }
  } else {
    state.bills.push({ id: uid(), name, amount, dueDay, recurring, paymentMethod, months: recurring ? [] : ui.modal.months.slice(), paidMonths:{}, amountOverrides:{}, paymentMethodOverrides:{} });
  }
  saveState(); closeModal();
}

function loadSuggestedCategories(){
  askConfirm('Isso vai adicionar categorias e palavras-chave prontas, mesclando com as que você já tem. Continuar?', ()=>{
    SUGGESTED_CATEGORIES.forEach(sc=>{
      const existing = state.categories.find(c=>normalizeStr(c.name)===normalizeStr(sc.name) && c.type===sc.type);
      if(existing) sc.keywords.forEach(kw=>{ if(!existing.keywords.some(k=>normalizeStr(k)===normalizeStr(kw))) existing.keywords.push(kw); });
      else state.categories.push({name: sc.name, type: sc.type, color: sc.color, keywords: [...sc.keywords]});
    });
    saveState();
    askConfirm('Categorias adicionadas! Quer reclassificar os lançamentos já existentes agora?', ()=>{
      state.transactions.forEach(t=>{ t.category = guessCategory(t.desc, t.type); });
      saveState(); render();

  });

function exportBackup(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().slice(0,10);
  a.download = `cofre-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleBackupFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    let loaded;
    try{ loaded = JSON.parse(ev.target.result); }
    catch(err){ alert('Esse arquivo não parece ser um backup válido do Cofre.'); return; }
    if(!loaded || !Array.isArray(loaded.transactions) || !Array.isArray(loaded.categories)){
      alert('Esse arquivo não parece ser um backup válido do Cofre.');
      return;
    }
    askConfirm('Isso vai SUBSTITUIR todos os dados atuais do app pelos dados desse backup. Os dados de agora serão perdidos se você não tiver outro backup deles.' + (sy.session ? ' A sincronização está ligada: a nuvem (e os outros aparelhos) também serão substituídos por esse backup.' : '') + ' Continuar?', ()=>{
      sySafetyCopy('antes-de-restaurar-backup');
      state = Object.assign({ bills:[], dashboardPrefs:{order:['chart','categories','categoriesIncome','commitments','projections'],collapsed:{}} }, loaded);
      if(!state.dashboardPrefs) state.dashboardPrefs = {order:['chart','categories','categoriesIncome','commitments','projections'],collapsed:{}};
      migrateDashboardOrder();
      migrateCategoryTypes();
      state.bills = migrateBills(state.bills);
      ui.selectedTx = [];
      saveState();
      ui.tab = 'dashboard';
      render();
    });
  };
  reader.readAsText(file);
}

function saveTx(){
  const amount = parseFloat(document.getElementById('mAmount').value);
  const desc = document.getElementById('mDesc').value || 'Lançamento';
  const paymentMethod = document.getElementById('mPaymentMethod').value;
  const date = document.getElementById('mDate').value;
  const category = document.getElementById('mCategory').value;
  if(!amount || !date){ alert('Preencha valor e data.'); return; }
  learnFromCorrection(desc, category, ui.modal.txType);
  // de onde saiu o dinheiro: da caixinha escolhida (até o saldo dela) e, se faltar, o resto sai da conta corrente
  let boxId=null, boxAmt=0;
  if(ui.modal.txType==='expense'){
    const sel=document.getElementById('mBox'), v=sel?sel.value:'conta';
    if(v && v!=='conta' && boxById(v)){ boxId=v; boxAmt=r2(Math.min(amount, boxAvailFor(v, date, ui.modal.edit||null))); }
  }
  let txId;
  if(ui.modal.edit){
    const t = state.transactions.find(t=>t.id===ui.modal.edit); txId=t.id;
    Object.assign(t, {amount, desc, paymentMethod, date, category, type: ui.modal.txType});
    if(boxId){ t.boxId=boxId; t.boxAmt=boxAmt; } else { delete t.boxId; delete t.boxAmt; }
  } else {
    txId=uid(); const nt={id:txId, amount, desc, paymentMethod, date, category, type: ui.modal.txType};
    if(boxId){ nt.boxId=boxId; nt.boxAmt=boxAmt; }
    state.transactions.push(nt);
  }
  cleanupEmptyAutoCategories(); saveState(); closeModal();
  if(boxId && r2(amount-boxAmt)>0.004){ try{ syToast('A caixinha '+boxById(boxId).name+' não tinha tudo: '+fmtRaw(r2(amount-boxAmt))+' saíram da conta corrente.'); }catch(e){} }
}

}

// ====================== CAIXINHAS ======================
// Como funciona: o "dinheiro total" é o do app (saldo inicial + entradas − saídas).
// Cada caixinha tem saldo próprio = valor inicial + separações − devoluções − o que saiu dela nas compras (tx.boxAmt).
// Conta corrente = dinheiro total − soma das caixinhas. Separar não é gasto: só muda o dinheiro de lugar.
function r2(n){ return Math.round((Number(n)+Number.EPSILON)*100)/100; }
function boxes(){ return state.caixinhas||[]; }
function boxById(id){ return boxes().find(b=>b.id===id)||null; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function boxEnd(m){ return m===curMonth()?todayISO():m+'-'+String(daysIn(m)).padStart(2,'0'); }
function boxBalanceAt(id,iso,exceptTx){
  const b=boxById(id); if(!b) return 0;
  let s=Number(b.base)||0;
  (state.transfers||[]).forEach(t=>{ if(t.boxId===id&&t.date<=iso) s+=t.amount; });
  state.transactions.forEach(t=>{ if(t.boxId===id&&t.type==='expense'&&t.date<=iso&&t.id!==exceptTx) s-=(t.boxAmt||0); });
  return r2(s);
}
function boxTotalAt(iso){ return r2(boxes().reduce((a,b)=>a+boxBalanceAt(b.id,iso),0)); }
function totalAt(iso){ const m=iso.slice(0,7); let s=saldoInicial(m); txInMonth(m).forEach(t=>{ if(t.date<=iso) s+=(t.type==='income'?t.amount:-t.amount); }); return r2(s); }
function contaAt(iso){ return r2(totalAt(iso)-boxTotalAt(iso)); }
function contaSaldo(m){ return contaAt(boxEnd(m)); }

// qual caixinha combina com esta categoria/descrição (só uma sugestão; você sempre pode trocar)
function boxTokens(b){ return [b.name].concat(String(b.links||'').split(/[,;]/)).map(s=>norm(s).trim()).filter(s=>s.length>=3); }
function suggestBox(category,desc){
  const c=norm(category||''), d=norm(desc||''); let best=null, bs=0;
  boxes().forEach(b=>{ let s=0;
    boxTokens(b).forEach(k=>{ if(c&&c===k) s=Math.max(s,3); else if(c.length>=3&&(c.includes(k)||k.includes(c))) s=Math.max(s,2); else if(d.includes(k)) s=Math.max(s,1); });
    if(s>bs){ bs=s; best=b; } });
  return best;
}
function txCategoryChanged(cat){
  const m=ui.modal; if(!m||m.type!=='tx'||m.boxAuto===false) return;
  const dEl=document.getElementById('mDesc'), sg=suggestBox(cat,dEl?dEl.value:'');
  m.boxId=sg?sg.id:'conta'; const sel=document.getElementById('mBox'); if(sel) sel.value=m.boxId; txBoxHint();
}
// quanto da caixinha realmente pode ser usado nesta compra (nunca deixa a caixinha negativa)
function boxAvailFor(id,date,exceptTx){ return Math.max(0,Math.min(boxBalanceAt(id,date||todayISO(),exceptTx),boxBalanceAt(id,'9999-12-31',exceptTx))); }
function txBoxHint(){
  const el=document.getElementById('mBoxHint'), sel=document.getElementById('mBox'); if(!el||!sel) return;
  const b=boxById(sel.value); if(!b){ el.textContent=''; return; }
  const dEl=document.getElementById('mDate'), aEl=document.getElementById('mAmount');
  const avail=boxAvailFor(b.id,dEl&&dEl.value,ui.modal&&ui.modal.edit||null), amt=parseFloat(aEl&&aEl.value)||0;
  let t='Sai da caixinha '+b.name+' (saldo '+fmt(avail)+').'+(ui.modal&&ui.modal.boxAuto?' Sugerida pela categoria.':'');
  if(amt>avail+0.004) t+=' Faltam '+fmt(r2(amt-avail))+': esse resto sai da conta corrente.';
  el.textContent=t;
}

// resumo de uma caixinha no mês: separado, devolvido, gasto, o que passou e a porcentagem que ainda resta
function boxMonth(b,m){
  const lo=m+'-01', hi=m+'-31', pm=shiftMonth(m,-1), startIso=pm+'-'+String(daysIn(pm)).padStart(2,'0');
  const trs=(state.transfers||[]).filter(t=>t.boxId===b.id&&t.date>=lo&&t.date<=hi);
  const sep=r2(trs.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0)), dev=r2(-trs.filter(t=>t.amount<0).reduce((a,t)=>a+t.amount,0));
  const txs=txInMonth(m).filter(t=>t.boxId===b.id&&t.type==='expense');
  const spent=r2(txs.reduce((a,t)=>a+(t.boxAmt||0),0)), over=r2(txs.reduce((a,t)=>a+Math.max(0,t.amount-(t.boxAmt||0)),0));
  const start=Math.max(0,boxBalanceAt(b.id,startIso)), avail=r2(start+sep-dev), rem=Math.max(0,boxBalanceAt(b.id,boxEnd(m)));
  const p=avail>0?Math.min(1,rem/avail):0, att=1-(((state.settings||{}).alertPct||80)/100);
  const st=over>0.004?'exc':(rem<=0.004&&(spent>0||avail>0))?'done':(avail>0&&p<=att)?'att':'ok';
  return {sep,dev,spent,over,start,avail,rem,p,st};
}
function boxAlerts(){
  return boxes().map(b=>({b,s:boxMonth(b,ui.month)})).filter(x=>x.s.st!=='ok').map(({b,s})=>({
    st:s.st==='exc'?'exc':s.st,
    t:s.st==='exc'?`Caixinha <b>${esc(b.name)}</b> acabou e passou ${fmt(s.over)}: esse valor saiu da conta corrente.`
     :s.st==='done'?`Caixinha <b>${esc(b.name)}</b> acabou. Não sobrou nada.`
     :`Caixinha <b>${esc(b.name)}</b> está com só ${pct(s.p)}% (${fmt(s.rem)}).`}));
}

function boxesView(){
  const m=ui.month, bs=boxes(), conta=contaSaldo(m), cx=boxTotalAt(boxEnd(m)), tot=r2(conta+cx);
  const pen='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
  const cards=bs.map(b=>{
    const s=boxMonth(b,m), col=s.st==='ok'?'#0b4d3d':'#b0903f';
    const badge=s.st==='exc'?'<span class="badge exc">Passou</span>':s.st==='done'?'<span class="badge att">Acabou</span>':s.st==='att'?'<span class="badge att">Quase no fim</span>':'';
