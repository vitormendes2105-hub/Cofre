<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cofre — Painel Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#eef1f4;
    --surface:#ffffff;
    --surface-2:#f6f7f9;
    --border:#e3e7ec;
    --ink:#0e1620;
    --muted:#69737e;
    --brand:#0b4d3d;
    --brand-2:#0f6b52;
    --brand-soft:#e3efe9;
    --gold:#c8952c;
    --gold-soft:#faf1de;
    --green:#12805c;
    --green-soft:#e5f4ee;
    --red:#d1453b;
    --red-soft:#fbeae8;
    --shadow: 0 1px 2px rgba(14,22,32,.04), 0 6px 20px rgba(14,22,32,.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:960px;margin:0 auto;padding:22px 18px 100px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  header h1{font-family:'Fraunces',serif;font-size:23px;font-weight:700;margin:0;letter-spacing:-.3px;}
  header .sub{font-size:11px;color:var(--muted);letter-spacing:.4px;}
  nav{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  nav button{font-family:'Inter';font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:8px 15px;border-radius:22px;cursor:pointer;transition:.15s;}
  nav button.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
  .card-head-left{display:flex;align-items:center;gap:8px;}
  .card-actions{display:flex;align-items:center;gap:4px;}
  .icon-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);}
  .icon-btn:hover{color:var(--ink);}
  .hero{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-2) 100%);border-radius:20px;padding:26px 24px;color:#fff;margin-bottom:14px;box-shadow:var(--shadow);}
  .hero .label{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:1px;}
  .hero .balance{font-family:'IBM Plex Mono';font-size:38px;font-weight:600;margin:4px 0 16px;letter-spacing:-1px;}
  .hero .pills{display:flex;gap:10px;flex-wrap:wrap;}
  .pill{background:rgba(255,255,255,.14);border-radius:12px;padding:9px 14px;flex:1;min-width:120px;}
  .pill .plabel{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.5px;}
  .pill .pval{font-family:'IBM Plex Mono';font-size:16px;font-weight:600;margin-top:2px;}
  h2{font-family:'Fraunces',serif;font-size:17px;margin:0;font-weight:600;}
  h3{font-family:'Fraunces',serif;font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;padding:6px 8px;border-bottom:1.5px solid var(--border);}
  td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
  td.num{font-family:'IBM Plex Mono';text-align:right;white-space:nowrap;}
  .tag{display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:12px;background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
  .paytag{font-size:10px;color:var(--muted);}
  .row-actions{display:flex;gap:4px;}
  .row-actions button{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}
  .row-actions button:hover{color:var(--ink);}
  input,select,textarea{font-family:'Inter';font-size:14px;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--ink);width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-2);outline-offset:-1px;}
  textarea{font-family:'IBM Plex Mono';font-size:12px;min-height:120px;}
  label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .btn{font-family:'Inter';font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);}
  .btn-danger{background:var(--red);color:#fff;}
  .btn:disabled{opacity:.55;cursor:default;}
  .fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#241a05;border:none;cursor:pointer;box-shadow:0 8px 20px rgba(200,149,44,.4);z-index:50;display:flex;align-items:center;justify-content:center;}
  .modal-bg{position:fixed;inset:0;background:rgba(14,22,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow:auto;}
  .modal h2{margin-bottom:16px;}
  .seg{display:flex;gap:8px;margin-bottom:14px;}
  .seg button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600;font-size:13px;}
  .seg button.active.income{background:var(--green-soft);border-color:var(--green);color:var(--green);}
  .seg button.active.expense{background:var(--red-soft);border-color:var(--red);color:var(--red);}
  .empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:13.5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .month-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .month-nav button{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .month-nav .cur{font-family:'IBM Plex Mono';font-weight:600;font-size:14.5px;min-width:120px;text-align:center;}
  .commit-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono';font-size:13px;}
  .footer-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px;}
  .preview-table{max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:10px;margin-top:10px;}
  .insight{border-left:3px solid var(--gold);background:var(--gold-soft);padding:11px 14px;border-radius:0 10px 10px 0;font-size:13.5px;margin-bottom:10px;line-height:1.5;}
  .insight.warn{border-color:var(--red);background:var(--red-soft);}
  .insight.good{border-color:var(--green);background:var(--green-soft);}
  .barchart{display:flex;align-items:flex-end;gap:12px;height:150px;padding-top:10px;overflow-x:auto;}
  .barchart .col{flex:0 0 auto;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .barchart .bars{display:flex;gap:3px;align-items:flex-end;height:120px;}
  .barchart .bar{width:13px;border-radius:4px 4px 0 0;}
  .barchart .bar.projected{opacity:.4;background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(255,255,255,.5) 3px,rgba(255,255,255,.5) 5px);}
  .barchart .mlabel{font-size:10px;color:var(--muted);margin-top:6px;font-family:'IBM Plex Mono';white-space:nowrap;}
  .hbar-track{background:var(--surface-2);border-radius:5px;height:9px;overflow:hidden;margin-top:4px;}
  .hbar-fill{height:100%;border-radius:5px;}
  .drop-zone{border:1.5px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:12px;background:var(--surface-2);}
  .drop-zone.drag{border-color:var(--gold);background:var(--gold-soft);}
  .tabs-sub{display:flex;gap:6px;margin-bottom:14px;}
  .tabs-sub button{font-size:12px;padding:6px 13px;border-radius:16px;border:1px solid var(--border);background:#fff;cursor:pointer;}
  .tabs-sub button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .reorder-controls{display:flex;flex-direction:column;gap:2px;}
  .reorder-controls button{background:none;border:none;cursor:pointer;color:var(--muted);padding:1px;}
  .reorder-controls button:hover{color:var(--ink);}
  .reorder-controls button:disabled{opacity:.25;cursor:default;}
  .checkbox-row input[type=checkbox]{width:auto;}

  /* ===== Tema Auro: creme, verde-floresta, dourado ===== */
  :root{
    --bg:#f5f2ec; --surface:#ffffff; --surface-2:#f8f5ef; --border:#e9e4d9;
    --ink:#0a2a1d; --muted:#6a7a71;
    --brand:#0b4d3d; --brand-2:#0f6b52; --brand-deep:#042a1d; --brand-soft:#e6f1ec;
    --gold:#b0903f; --gold-soft:#f6efdc;
    --shadow:0 1px 2px rgba(4,42,29,.04),0 22px 44px -18px rgba(4,42,29,.16);
    --serif:'Instrument Serif','Fraunces',serif;
  }
  body{background:var(--bg);}
  .app{max-width:980px;padding-top:14px;}
  header{position:sticky;top:10px;z-index:40;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:9px 10px 9px 24px;box-shadow:var(--shadow);margin-bottom:22px;}
  .wordmark{font-family:var(--serif);font-style:italic;font-size:34px;line-height:1;color:var(--brand);letter-spacing:-.5px;}
  header .sub{display:none;}
  .hdr-cta{background:var(--brand-deep);color:#fff;border:none;border-radius:999px;padding:11px 20px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Inter';}
  nav{gap:8px;}
  nav button{border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.7);padding:9px 17px;}
  nav button.active{background:var(--brand-deep);border-color:var(--brand-deep);}
  .card{border-radius:26px;border:1px solid rgba(233,228,217,.7);padding:24px;box-shadow:var(--shadow);}
  h2{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.2px;}
  h3{font-family:var(--serif);font-weight:400;font-size:18px;}
  .btn{border-radius:999px;} .btn-primary{background:var(--brand-deep);}
  input,select,textarea{border-radius:12px;}
  .modal{border-radius:26px;} .modal h2{font-size:26px;}
  .fab{background:var(--brand-deep);color:#fff;box-shadow:0 14px 30px -8px rgba(4,42,29,.5);}
  td.num,.commit-row,.month-nav .cur{font-family:'Inter';font-variant-numeric:tabular-nums;}
  .month-nav .cur{font-family:var(--serif);font-size:22px;font-weight:400;}
  .month-nav button{border-radius:999px;}
  .insight{border-radius:0 14px 14px 0;border-left-color:var(--gold);}
  .hbar-track{height:7px;background:#eee9de;}
  th,label{letter-spacing:.14em;}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .eyebrow:before,.eyebrow:after{content:"";height:1px;width:34px;background:var(--gold);opacity:.7;}
  .resumo{padding:30px 28px;}
  .resumo .big{font-family:var(--serif);font-size:clamp(46px,9vw,68px);line-height:1;color:var(--brand-deep);letter-spacing:-1px;}
  .resumo .big.neg{color:#a8402f;}
  .resumo .lead{font-size:15.5px;line-height:1.65;color:var(--ink);margin:16px 0 0;max-width:62ch;}
  .resumo .lead b{color:var(--brand);font-weight:600;}
  .resumo em{font-family:var(--serif);font-size:1.15em;color:var(--gold);}
  .resumo .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
  .kpi{flex:1;min-width:130px;background:var(--surface-2);border-radius:16px;padding:12px 16px;}
  .kpi .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  .kpi .v{font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;}
  .donut-wrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .donut-wrap svg{flex:0 0 auto;}
  .legend{flex:1;min-width:200px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px 22px;font-size:13px;}
  .legend span.p{font-weight:700;margin-left:4px;}
  .legend .dot{margin-right:7px;}
  .goal{display:flex;align-items:center;gap:18px;padding:16px;border-radius:20px;background:var(--surface-2);margin-bottom:10px;}
  .goal .gname{font-size:15px;font-weight:600;}
  .goal .gval{font-family:var(--serif);font-size:28px;line-height:1.1;}
  .goal .gval small{font-family:'Inter';font-size:12px;color:var(--muted);}
  .goal .gsub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .goal .gbtns{margin-left:auto;display:flex;gap:6px;}
  .chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--brand);}
  .chip.x{color:var(--muted);}

  /* ===== Fundo: gravura ao fundo, estilo Auro ===== */

 x1='753' y1='330' x2='753' y2='400'/%3E%3Crect x='786' y='225' width='30' height='70'/%3E%3Cpath d='M786 225 Q801 211 816 225'/%3E%3Cline x1='801' y1='225' x2='801' y2='295'/%3E%3Crect x='786' y='330' width='30' height='70'/%3E%3Cpath d='M786 330 Q801 316 816 330'/%3E%3Cline x1='801' y1='330' x2='801' y2='400'/%3E%3Cpath d='M180 470 H880 M165 482 H895 M150 494 H910 M135 506 H925'/%3E%3C/g%3E%3C/svg%3E") no-repeat right -60px bottom 0/auto 100%;opacity:.42;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to top,#000 35%,transparent 100%);mask-image:linear-gradient(to top,#000 35%,transparent 100%);}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 420px at 15% -5%,rgba(255,255,255,.75),transparent 70%);}
  .app{position:relative;z-index:1;}
  @media (max-width:640px){body::before{opacity:.3;background-position:right -220px bottom 0;}}

  /* ===== Chat ===== */
  .chatlog{display:flex;flex-direction:column;gap:12px;margin:14px 0;max-height:420px;overflow:auto;}
  .chatlog:empty:before{content:"Pergunte algo ou toque em uma sugestão.";color:var(--muted);font-size:13.5px;}
  .msg{font-size:14.5px;line-height:1.6;max-width:92%;}
  .msg.u{align-self:flex-end;background:var(--brand-soft);color:var(--brand-deep);padding:11px 18px;border-radius:20px;}
  .msg.a{align-self:flex-start;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);padding:16px 18px;border-radius:22px;}
  .msg.a b{color:var(--brand);font-weight:600;}
  .msg.a hr{border:none;border-top:1px solid var(--border);margin:12px 0;}
  .msg .donut-wrap{margin:10px 0;gap:16px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .chatbar{display:flex;gap:8px;}
  .chatbar input{border-radius:999px;padding:12px 18px;}

async function storageGet(key){
  if(window.storage){
    const r = await window.storage.get(key, false);
    return r ? r.value : null;
  }
  return localStorage.getItem(key);
}
async function storageSet(key, value){
  if(window.storage){ await window.storage.set(key, value, false); return; }
  localStorage.setItem(key, value);
}
function migrateBills(bills){
  return (bills||[]).map(b=>{
    if(b.months !== undefined || b.recurring !== undefined) return b; // já no formato novo
    return {
      id: b.id, name: b.name, amount: b.amount, dueDay: b.dueDay,
      recurring: false,
      months: b.month ? [b.month] : [],
      paidMonths: b.month ? { [b.month]: !!b.paid } : {}
    };
  });
}

// ---------- utilidades ----------
function uid(){ return Math.random().toString(36).slice(2,10); }
function fmtRaw(n){ return (n<0?'-':'') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function monthLabel(ym){ const [y,m] = ym.split('-'); return MONTHS[parseInt(m,10)-1] + ' / ' + y; }
function shiftMonth(ym, delta){
  let [y,m] = ym.split('-').map(Number);
  m += delta;
  while(m>12){m-=12;y++;}
  while(m<1){m+=12;y--;}
  return y + '-' + String(m).padStart(2,'0');
}
function normalizeStr(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function isValidIsoDate(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  const [y,m,d] = iso.split('-').map(Number);
  return y>=2000 && y<=2100 && m>=1 && m<=12 && d>=1 && d<=31;
}
function parseNumberBR(v){
  if(typeof v === 'number') return v;
  let s = String(v).replace(/R\$/gi,'').trim();
  if(s==='') return NaN;
  if(s.includes(',')){ s = s.replace(/\./g,'').replace(',', '.'); }
  return parseFloat(s);
}
function guessCategory(desc, type){
  const d = normalizeStr(desc);
  let best = null, bestLen = -1;
  for(const c of state.categories){
    if(c.type && c.type!==type) continue;
    for(const kw of c.keywords){
      if(!kw) continue;
      const nk = normalizeStr(kw);
      if(nk && d.includes(nk) && nk.length > bestLen){ best = c.name; bestLen = nk.length; }
    }
  }
  return best || 'Outros';
}
function catColor(name, type){
  const c = state.categories.find(c=>c.name===name && (!type || !c.type || c.type===type));
  return c ? c.color : '#69737e';
}
function categoriesOfType(type){ return state.categories.filter(c=>c.type===type); }
function detectPaymentMethod(rawDesc){
  const d = normalizeStr(rawDesc);
  if(d.includes('pix')) return 'Pix';
  if(d.includes('debito')) return 'Cartão de débito';
  if(d.includes('credito')) return 'Cartão de crédito';
  if(d.includes('boleto')) return 'Boleto';
  if(d.includes(' ted') || d.includes(' doc') || d.startsWith('ted') || d.startsWith('doc')) return 'TED/DOC';
  if(d.includes('saque') || d.includes('dinheiro')) return 'Dinheiro';
  return 'Outro';
}
function cleanDescription(rawDesc){
  let s = rawDesc || '';
  s = s.replace(/Transferência\s+(recebida|enviada)(\s+pelo\s+Pix)?\s*-?\s*/i,'');
  s = s.replace(/Compra\s+no\s+(débito|debito|crédito|credito)(\s+via\s+NuPay)?\s*-?\s*/i,'');
  s = s.replace(/Pagamento\s+de\s+boleto\s+efetuado\s*-?\s*/i,'');
  s = s.split(/\s+(Agência|Agencia|Ag\.|Conta:|CPF|CNPJ)/i)[0];
  s = s.split(' - ')[0];
  return s.trim() || 'Lançamento';
}
function extractKeyword(desc){
  return normalizeStr(cleanDescription(desc)).slice(0,40);
}

function askConfirm(message, onYes){ ui.confirmBox = {message, onYes}; render(); }
function resolveConfirm(yes){
  const cb = ui.confirmBox && ui.confirmBox.onYes;
  ui.confirmBox = null; render();
  if(yes && cb) cb();
}

function learnFromCorrection(desc, category, type){
  if(category==='Outros') return;
  if(guessCategory(desc, type)===category) return;
  const kw = extractKeyword(desc);
  if(kw && kw.length>=3){
    const cat = state.categories.find(c=>c.name===category && (!type || !c.type || c.type===type));
    if(cat && !cat.keywords.some(k=>normalizeStr(k)===normalizeStr(kw))) cat.keywords.push(kw);
  }
}
function cleanupEmptyAutoCategories(){
  state.categories = state.categories.filter(c=>{
    if(!c.auto) return true;
    return state.transactions.some(t=>t.category===c.name && t.type===c.type);
  });
}
function findOrphanTransactions(){ return state.transactions.filter(t=>!isValidIsoDate(t.date)); }

function parseExtractText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const results = [];
  const dateRe = /(\d{2}\/\d{2}\/\d{4}|\d{2}\/\d{2})/;
  for(const line of lines){
    const dm = line.match(dateRe);
    if(!dm) continue;
    let dateStr = dm[0];
    if(dateStr.length===5) dateStr += '/' + ui.month.slice(0,4);
    const [dd,mm,yyyy] = dateStr.split('/');
    const ddN=parseInt(dd,10), mmN=parseInt(mm,10), yyyyN=parseInt(yyyy,10);
    if(!ddN||!mmN||ddN<1||ddN>31||mmN<1||mmN>12||yyyyN<2000||yyyyN>2100) continue;
    const iso = yyyy + '-' + mm + '-' + dd;

    const lineNoDate = line.replace(dm[0], '');
    const numMatches = lineNoDate.match(/-?\d[\d.,]*\d|-?\d+/g);
    if(!numMatches || !numMatches.length) continue;
    const rawVal = numMatches[numMatches.length-1];
    const val = parseNumberBR(rawVal);
    if(isNaN(val) || val===0) continue;

    const isNeg = lineNoDate.trim().startsWith('-') || lineNoDate.includes('-'+rawVal) || lineNoDate.includes('- '+rawVal);
    let rawDesc = lineNoDate.replace(rawVal,'').replace(/^-|R\$/gi,'').trim();
    const paymentMethod = detectPaymentMethod(rawDesc);
    const desc = cleanDescription(rawDesc);
    const type = (val < 0 || isNeg) ? 'expense' : 'income';
    results.push({ id: uid(), date: iso, desc, paymentMethod, amount: Math.abs(val), type, category: guessCategory(desc, type) });
  }
  return results;
}

function detectDelimiter(text){
  const firstLine = (text.split(/\r?\n/)[0] || '');
  const commas = (firstLine.match(/,/g)||[]).length;
  const semicolons = (firstLine.match(/;/g)||[]).length;
  return semicolons > commas ? ';' : ',';
}
function looksLikeCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(Boolean).slice(0,6);
  if(lines.length<2) return false;
  const delim = detectDelimiter(text);
  const counts = lines.map(l=>l.split(delim).length);
  const consistent = counts.every(c=>c===counts[0]) && counts[0]>=2;
  const headerLower = lines[0].toLowerCase();
  const looksHeader = headerLower.includes('data') && (headerLower.includes('valor') || headerLower.includes('descri'));
  return consistent && (looksHeader || counts[0]>=3);
}
function parseCSVRaw(text, delimiter){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === delimiter){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field='';
        if(!(row.length===1 && row[0]==='')) rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim()));
}
function parseCsvText(text){
  const delimiter = detectDelimiter(text);
  const rows = parseCSVRaw(text, delimiter);
  return rowsToTransactions(rows);
}
function excelValueToDate(v){
  if(typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    return d.y + '-' + String(d.m).padStart(2,'0') + '-' + String(d.d).padStart(2,'0');
  }
  const s = String(v).trim();
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let [_,dd,mm,yy] = m; if(yy.length===2) yy = '20'+yy; return yy + '-' + mm.padStart(2,'0') + '-' + dd.padStart(2,'0'); }
  const m2 = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m2) return m2[1]+'-'+m2[2].padStart(2,'0')+'-'+m2[3].padStart(2,'0');
  return null;
}
function findHeaderInfo(rows){
  let headerRowIdx=-1, colDate=-1, colDesc=-1, colVal=-1, colIn=-1, colOut=-1;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const row = rows[i].map(c=>String(c).toLowerCase());
    const dIdx = row.findIndex(c=>c.includes('data')||c.includes('date'));
    const descIdx = row.findIndex(c=>c.includes('descri')||c.includes('histor')||c.includes('lança')||c.includes('titulo')||c.includes('estabelecimento'));
    const vIdx = row.findIndex(c=>(c.includes('valor')||c.includes('amount')||c.includes('montante')) && !c.includes('saldo'));
    const inIdx = row.findIndex(c=>c.includes('entrada')||c.includes('crédito')||c.includes('credito'));
    const outIdx = row.findIndex(c=>c.includes('saída')||c.includes('saida')||c.includes('débito')||c.includes('debito'));
    if(dIdx>-1 && (vIdx>-1 || (inIdx>-1 && outIdx>-1))){
      headerRowIdx=i; colDate=dIdx; colDesc=descIdx; colVal=vIdx; colIn=inIdx; colOut=outIdx;
      break;
    }
  }
  return {headerRowIdx, colDate, colDesc, colVal, colIn, colOut};
}
function guessColumnsByContent(rows){
  const sample = rows.slice(0, Math.min(rows.length,25));
  const ncols = Math.max(1, ...sample.map(r=>r.length));
  const dateScore = new Array(ncols).fill(0);
  const numScore = new Array(ncols).fill(0);
  const textLen = new Array(ncols).fill(0);
  sample.forEach(row=>{
    for(let c=0;c<ncols;c++){
      const v = row[c];
      if(v===undefined || v==='') continue;
      const s = String(v);
      if(/\d{1,2}\/\d{1,2}\/\d{2,4}/.test(s) || (typeof v==='number' && v>20000 && v<60000)) dateScore[c]++;
      if(!isNaN(parseNumberBR(v)) && /\d/.test(s) && !/\//.test(s)) numScore[c]++;
      textLen[c] += s.length;
    }
  });
  let colDate = 0, bestD=-1;
  for(let c=0;c<ncols;c++){ if(dateScore[c]>bestD){ bestD=dateScore[c]; colDate=c; } }
  let colVal = -1, bestV=-1;
  for(let c=0;c<ncols;c++){ if(c!==colDate && numScore[c]>bestV){ bestV=numScore[c]; colVal=c; } }
  let colDesc = -1, bestLen=-1;
  for(let c=0;c<ncols;c++){ if(c!==colDate && c!==colVal && textLen[c]>bestLen){ bestLen=textLen[c]; colDesc=c; } }
  if(colDesc===-1) colDesc = colVal===1?2:1;
  if(colVal===-1) colVal = colDesc===2?1:2;
  return {colDate, colDesc, colVal};
}
function rowsToTransactions(rows){
  const info = findHeaderInfo(rows);
  const results = [];
  if(info.headerRowIdx>-1){
    for(let i=info.headerRowIdx+1;i<rows.length;i++){
      const row = rows[i];
      if(!row || row.length<2) continue;
      const dateRaw = row[info.colDate];
      if(dateRaw===undefined || dateRaw==='') continue;
      const date = excelValueToDate(dateRaw);
      if(!isValidIsoDate(date)) continue;
      const rawDesc = String(info.colDesc>-1 ? row[info.colDesc] : 'Lançamento').trim() || 'Lançamento';
      const paymentMethod = detectPaymentMethod(rawDesc);
      const desc = cleanDescription(rawDesc);
      if(info.colVal>-1){
        const rawVal = row[info.colVal];
        if(rawVal===undefined || rawVal==='' || isNaN(parseNumberBR(rawVal))) continue;
        const val = parseNumberBR(rawVal);
        if(!val) continue;
        results.push({ id: uid(), date, desc, paymentMethod, amount: Math.abs(val), type: val<0?'expense':'income', category: guessCategory(desc, val<0?'expense':'income') });
      } else if(info.colIn>-1 && info.colOut>-1){
        const inVal = parseNumberBR(row[info.colIn]);
        const outVal = parseNumberBR(row[info.colOut]);
        if(inVal && !isNaN(inVal)) results.push({ id: uid(), date, desc, paymentMethod, amount: Math.abs(inVal), type:'income', category: guessCategory(desc,'income') });
        if(outVal && !isNaN(outVal)) results.push({ id: uid(), date, desc, paymentMethod, amount: Math.abs(outVal), type:'expense', category: guessCategory(desc,'expense') });
      }
    }
  } else {
    const g = guessColumnsByContent(rows);
    for(let i=0;i<rows.length;i++){
      const row = rows[i];
      if(!row || row.length<2) continue;
      const rawVal = row[g.colVal];
      if(rawVal===undefined || rawVal==='' || isNaN(parseNumberBR(rawVal))) continue;
      const val = parseNumberBR(rawVal);
      if(!val) continue;
      const dateRaw = row[g.colDate];
      if(dateRaw===undefined || dateRaw==='') continue;
      const date = excelValueToDate(dateRaw);
      if(!isValidIsoDate(date)) continue;
      const rawDesc = String(row[g.colDesc]||'Lançamento').trim();
      results.push({ id: uid(), date, desc: cleanDescription(rawDesc), paymentMethod: detectPaymentMethod(rawDesc), amount: Math.abs(val), type: val<0?'expense':'income', category: guessCategory(cleanDescription(rawDesc), val<0?'expense':'income') });
    }
  }
  return results;
}
async function parseExcelFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:false});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
  return rowsToTransactions(rows);
}

async function parsePdfFile(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let fullText = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const items = content.items.map(it=>({str: it.str, x: it.transform[4], y: it.transform[5]}));
    items.sort((a,b)=> b.y - a.y || a.x - b.x);
    const TOL = 3;
    let lines = [], curLine = [], curY = null;
    for(const it of items){
      if(!it.str.trim()) continue;
      if(curY===null || Math.abs(it.y-curY) <= TOL){ curLine.push(it); if(curY===null) curY = it.y; }
      else { lines.push(curLine.sort((a,b)=>a.x-b.x).map(o=>o.str).join(' ')); curLine=[it]; curY=it.y; }
    }
    if(curLine.length) lines.push(curLine.sort((a,b)=>a.x-b.x).map(o=>o.str).join(' '));
    fullText += lines.join('\n') + '\n';
  }
  if(!fullText.trim()){
    throw new Error('Este PDF parece ser uma imagem escaneada — não consigo extrair texto dele. Tente exportar em CSV/Excel ou colar o texto manualmente.');
  }
  return { text: fullText, transactions: parseExtractText(fullText) };
}

async function callAIExtractBatch(textChunk, categoryNames){
  const prompt =
    'Você é um assistente financeiro brasileiro. Abaixo está um trecho de texto bruto extraído de um extrato/fatura bancária em PDF. A formatação pode estar bagunçada — use bom senso pra reconstruir cada transação de verdade.\n\n' +
    'TEXTO EXTRAÍDO:\n"""\n' + textChunk + '\n"""\n\n' +
    'Categorias já existentes: ' + JSON.stringify(categoryNames) + '\n\n' +
    'Extraia TODAS as transações reais (ignore cabeçalho, rodapé, número de página, saldo total, dados de agência/conta/CPF). Para cada uma, retorne:\n' +
    '- date: AAAA-MM-DD (datas no Brasil são DD/MM/AAAA)\n' +
    '- desc: SÓ o nome da pessoa ou do estabelecimento, limpo — sem "Transferência", sem "Compra no débito", sem agência/conta/CPF\n' +
    '- paymentMethod: "Pix", "Cartão de débito", "Cartão de crédito", "Boleto", "TED/DOC", "Dinheiro" ou "Outro"\n' +
    '- amount: valor numérico positivo (ponto como decimal)\n' +
    '- type: "income" ou "expense"\n' +
    '- category: uma categoria EXISTENTE da lista se fizer sentido; senão, proponha um nome novo curto (ex: "Pix a revisar" pra pessoa física sem contexto)\n\n' +
    'Sem transações no trecho: retorne [].\n\n' +
    'Responda APENAS com um array JSON válido, sem texto antes/depois, sem markdown:\n' +
    '[{"date":"AAAA-MM-DD","desc":"...","paymentMethod":"...","amount":0.00,"type":"expense","category":"..."}]';
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
  });
  if(!response.ok) throw new Error('Falha na chamada à IA (status ' + response.status + ')');
  const data = await response.json();
  const text = (data.content || []).map(c => c.text || '').join('\n');
  return JSON.parse(text.replace(/```json|```/g, '').trim());
}
async function extractPdfWithAI(){
  if(!ui.rawPdfText) return;
  ui.aiLoading = true; ui.aiError = null; render();
  try{
    const lines = ui.rawPdfText.split('\n').filter(l=>l.trim());
    const CHUNK = 50;
    const allResults = [];
    for(let i=0;i<lines.length;i+=CHUNK){
      const chunk = lines.slice(i, i+CHUNK).join('\n');
      const results = await callAIExtractBatch(chunk, state.categories.map(c=>c.name));
      allResults.push(...results);
    }
    const built = [];
    allResults.forEach(r=>{
      if(!isValidIsoDate(r.date)) return;
      const amount = parseFloat(r.amount);
      if(!amount || isNaN(amount)) return;
      const catName = String(r.category || 'Outros').trim() || 'Outros';
      const txType = r.type==='income'?'income':'expense';
      const existing = state.categories.find(c=>normalizeStr(c.name)===normalizeStr(catName) && c.type===txType);
      if(!existing && catName!=='Outros') state.categories.push({ name: catName, type: txType, color: PALETTE[state.categories.length % PALETTE.length], keywords: [], auto: true });
      built.push({ id: uid(), date: r.date, desc: cleanDescription(String(r.desc||'Lançamento')), paymentMethod: r.paymentMethod || 'Outro', amount: Math.abs(amount), type: txType, category: existing?existing.name:catName });
    });
    if(built.length) ui.importPreview = built;
    else ui.aiError = 'A IA não encontrou transações reconhecíveis. Mantive a leitura local abaixo.';
    saveState();
  }catch(err){
    ui.aiError = 'Não consegui ler o PDF com IA (' + (err.message || 'erro desconhecido') + '). A leitura local abaixo continua disponível.';
  }
  ui.aiLoading = false; render();
}
async function callAIBatch(batch){
  const categoryNames = state.categories.map(c=>(c.type==='income'?'[entrada] ':'[saída] ')+c.name);
  const prompt = 'Você é um assistente financeiro pessoal brasileiro. Categorias existentes (marcadas se são de entrada ou saída): ' + JSON.stringify(categoryNames) + '\n\n' +
    'Transações:\n' + JSON.stringify(batch.map(t=>({id:t.id, data:t.date, descricao:t.desc, valor:t.amount, tipo:t.type}))) + '\n\n' +
    'Escolha a categoria EXISTENTE mais adequada pra cada uma, respeitando o tipo (uma transação "income" só pode usar categoria "[entrada]", uma "expense" só "[saída]"); se nenhuma servir, proponha um nome novo curto e específico (ex: "Pix a revisar"), sem o prefixo [entrada]/[saída].\n\n' +
    'Responda APENAS com array JSON: [{"id":"...","category":"..."}]';
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
  });
  if(!response.ok) throw new Error('Falha na chamada à IA (status ' + response.status + ')');
  const data = await response.json();
  const text = (data.content || []).map(c => c.text || '').join('\n');
  return JSON.parse(text.replace(/```json|```/g, '').trim());
}
async function refineCategoriesWithAI(){
  if(!ui.importPreview || !ui.importPreview.length) return;
  ui.aiLoading = true; ui.aiError = null; render();
  try{
    const BATCH = 15;
    for(let start=0; start<ui.importPreview.length; start += BATCH){
      const batch = ui.importPreview.slice(start, start + BATCH);
      const results = await callAIBatch(batch);
      results.forEach(r=>{
        const item = ui.importPreview.find(it=>it.id===r.id);
        if(!item || !r.category) return;
        const catName = String(r.category).trim();
        const existing = state.categories.find(c=>normalizeStr(c.name)===normalizeStr(catName) && c.type===item.type);
        if(existing) item.category = existing.name;
        else { state.categories.push({ name: catName, type: item.type, color: PALETTE[state.categories.length % PALETTE.length], keywords: [], auto: true }); item.category = catName; }
      });
    }
    saveState();
  }catch(err){
    ui.aiError = 'Não consegui completar a análise por IA (' + (err.message || 'erro desconhecido') + '). A categorização local continua valendo.';
  }
  ui.aiLoading = false; render();
}

async function handleImportFiles(fileList){
  const files = Array.from(fileList);
  const combined = []; const errors = [];
  ui.rawPdfText = null;
  for(const file of files){
    try{
      const ext = file.name.split('.').pop().toLowerCase();
      let results;
      if(ext==='pdf'){
        const parsed = await parsePdfFile(file);
        ui.rawPdfText = (ui.rawPdfText ? ui.rawPdfText + '\n' : '') + parsed.text;
        results = parsed.transactions;
      }
      else if(ext==='xlsx' || ext==='xls') results = await parseExcelFile(file);
      else if(ext==='csv'){ const text = await file.text(); results = parseCsvText(text); }
      else { const text = await file.text(); results = parseExtractText(text); }
      combined.push(...results);
    }catch(err){ errors.push(file.name + ': ' + (err.message || 'não consegui ler esse arquivo.')); }
  }
  ui.importPreview = combined;
  render();
  if(errors.length) alert('Atenção com estes arquivos:\n\n' + errors.join('\n'));
}

function changeMonth(d){ ui.month = shiftMonth(ui.month, d); render(); }
function txInMonth(m){ m = m || ui.month; return state.transactions.filter(t=>t.date.slice(0,7)===m); }
function monthTotals(m){
  const txs = txInMonth(m);
  const income = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  return {income, expense, balance: income-expense};
}
function monthsBetween(a,b){
  const [ay,am] = a.split('-').map(Number); const [by,bm] = b.split('-').map(Number);
  return (by-ay)*12 + (bm-am);
}
function getPurchaseInstallmentAmount(p, month){
  const base = (p.installmentValue !== undefined) ? p.installmentValue : (p.total/p.installments);
  return (p.amountOverrides && p.amountOverrides[month]!==undefined) ? p.amountOverrides[month] : base;
}
function monthlyCommitment(purchase, ym){
  const idx = monthsBetween(purchase.startMonth, ym);
  if(idx < 0 || idx >= purchase.installments) return 0;
  return getPurchaseInstallmentAmount(purchase, ym);
}
function totalCommitmentForMonth(ym){
  let total = 0;
  state.cards.forEach(card=>card.purchases.forEach(p=>{ total += monthlyCommitment(p, ym); }));
  return total;
}

const RAMP = ['#042a1d','#0b4d3d','#12805c','#3a9e7e','#8cc5b2','#c3ddd2'];
function rk(name){ return (window.__rk && window.__rk[name]) || catColor(name,'expense'); }
function pct(n){ return Math.round(n*100); }
function expenseRows(m){
  const by = {};
  txInMonth(m).filter(t=>t.type==='expense').forEach(t=>{ by[t.category]=(by[t.category]||0)+t.amount; });
  return Object.entries(by).sort((a,b)=>b[1]-a[1]);
}
function donutSvg(rows, total, size){
  const r=42, C=2*Math.PI*r; let off=0;
  const segs = rows.map(([n,v],i)=>{
    const len=v/total*C, col=(window.__rk&&window.__rk[n])||RAMP[RAMP.length-1];
    const s=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="17" stroke-dasharray="${Math.max(len-1.6,0.5)} ${C-Math.max(len-1.6,0.5)}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off+=len; return s;
  }).join('');
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}">${segs}
    <text x="60" y="56" text-anchor="middle" font-size="7" letter-spacing="1.2" fill="#6a7a71">TOTAL</text>
    <text x="60" y="69" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0a2a1d">${fmt(total)}</text></svg>`;
}
function widgetCategories(){
  const rows = expenseRows();
  if(!rows.length) return widgetCategoriesOld();
  window.__rk = {}; rows.forEach(([n],i)=>{ window.__rk[n] = RAMP[Math.min(i,RAMP.length-1)]; });
  const total = rows.reduce((s,r)=>s+r[1],0);
  const top = rows.slice(0,5), rest = rows.slice(5).reduce((s,r)=>s+r[1],0);
  const legendRows = rest>0 ? [...top, ['Demais', rest]] : top;
  const legend = legendRows.map(([n,v],i)=>`<div><span class="dot" style="background:${i<5?RAMP[i]:'#aab3ae'}"></span>${n}<span class="p">${pct(v/total)}%</span></div>`).join('');
  return `<div class="donut-wrap">${donutSvg(rows,total,170)}<div class="legend">${legend}</div></div>` + widgetCategoriesOld();
}
function resumoCard(){
  const cur = monthTotals(ui.month), prev = monthTotals(shiftMonth(ui.month,-1));
  const rows = expenseRows(), total = rows.reduce((s,r)=>s+r[1],0);
  if(!txInMonth().length){
    return `<div class="card resumo"><div class="eyebrow">Seu mês</div><div class="big">${fmt(0)}</div><p class="lead">Ainda não há lançamentos em <b>${monthLabel(ui.month)}</b>. Adicione um lançamento ou importe seu extrato para ver o resumo.</p></div>`;
  }
  let t = `Em <b>${monthLabel(ui.month)}</b> entraram <b>${fmt(cur.income)}</b> e saíram <b>${fmt(cur.expense)}</b>. `;
  if(cur.income>0){
    t += cur.balance>=0 ? `Sobraram <b>${fmt(cur.balance)}</b>, ${pct(cur.balance/cur.income)}% do que entrou. ` : `Faltaram <b>${fmt(-cur.balance)}</b> para fechar o mês. `;
  }

    t += `Comparado ao mês anterior, as saídas ${d>=0?'subiram':'caíram'} <em>${Math.abs(pct(d))}%</em>. `;
  }

      <div class="kpi"><div class="k">Saídas</div><div class="v">${fmt(cur.expense)}</div></div>
    </div></div>`;

function ringSvg(p, size){
  const r=26, C=2*Math.PI*r, v=Math.max(0,Math.min(1,p));
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}"><circle cx="32" cy="32" r="${r}" fill="none" stroke="#e9e4d9" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="#0b4d3d" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*v} ${C}" transform="rotate(-90 32 32)"/><text x="32" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#0a2a1d">${Math.round(v*100)}%</text></svg>`;
}
function monthsUntil(ym){
  const n = new Date(), [y,m] = ym.split('-').map(Number);

function metasCard(){

function addGoal(){

const SUGESTOES = ['Como está minha vida financeira?','Onde mais gastei?','Quanto fica comprometido nos próximos meses?','Onde posso economizar?','Quanto posso gastar esta semana?'];
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(t){ return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function oportunidades(){

  }

    if(!rows.length) return `Sem gastos lançados em ${ml}.`;
    return `Seus maiores gastos em <b>${ml}</b>:<hr>`+rows.slice(0,5).map(([c,v])=>`<b>${c}</b>: ${fmt(v)} (${pct(v/total)}%)`).join('<br>');
  }

function daysIn(m){ const [y,mo]=m.split('-').map(Number); return new Date(y,mo,0).getDate(); }
function projModel(){
  const months=[...new Set(state.transactions.map(t=>t.date.slice(0,7)))].sort();
  const hist=months.filter(m=>m<ui.month).slice(-((state.settings||{}).months||3));
  if(!hist.length) return null;
  const inc=hist.reduce((a,m)=>a+monthTotals(m).income,0)/hist.length;
  const vars=hist.map(m=>Math.max(0,monthTotals(m).expense-knownCommittedForMonth(m)));
  const variavel=vars.reduce((a,b)=>a+b,0)/vars.length;
  const rows=[1,2,3].map(i=>{ const m=shiftMonth(ui.month,i), fixas=billsTotalForMonth(m), parcelas=totalCommitmentForMonth(m), expense=fixas+parcelas+variavel;

  return {hist,inc,variavel,rows};
}
function projExpenseFor(m,fb){ const pm=projModel(), r=pm&&pm.rows.find(x=>x.m===m); return r?r.expense:fb+totalCommitmentForMonth(m); }
function widgetProjections(){

function toggleCut(n){ state.cuttable=state.cuttable||[]; const i=state.cuttable.indexOf(n); i>-1?state.cuttable.splice(i,1):state.cuttable.push(n); saveState(); render(); }
function planoMeta(g){
  const left=Math.max(0,g.target-g.saved); if(left<=0) return '';
  const pm=projModel(); if(!pm) return '<div class="plan">Lance pelo menos um mês anterior para eu montar um plano.</div>';
  const need=left/monthsUntil(g.deadline);
  const avgExp=pm.hist.reduce((a,m)=>a+monthTotals(m).expense,0)/pm.hist.length, cap=Math.max(0,pm.inc-avgExp);
  if(cap>=need) return `<div class="plan">Pela sua sobra média de <b>${fmt(cap)}/mês</b>, você já chega lá guardando <b>${fmt(need)}/mês</b>.</div>`;
  const gap=need-cap, avgCat=n=>pm.hist.reduce((a,m)=>a+(catMap(m)[n]||0),0)/pm.hist.length;
  const opts=(state.cuttable||[]).map(n=>({n,avg:avgCat(n),max:avgCat(n)*0.3})).filter(o=>o.max>0), maxCut=opts.reduce((a,o)=>a+o.max,0);
  let h=`Você precisa guardar <b>${fmt(need)}/mês</b> e hoje sobram <b>${fmt(cap)}</b>. Faltam <b>${fmt(gap)}/mês</b>.`;
  if(!opts.length) return `<div class="plan">${h}<br>Marque abaixo as categorias que você aceita reduzir e eu sugiro quanto.</div>`;
  if(maxCut>=gap){ const f=gap/maxCut; h+='<br>Uma forma de chegar lá:'+opts.map(o=>`<br>• <b>${o.n}</b>: reduzir ${fmt(o.max*f)} (de ${fmt(o.avg)}, ${pct(o.max*f/o.avg)}%)`).join(''); }
  else h+=`<br>Reduzir até 30% das categorias marcadas libera só ${fmt(maxCut)}/mês, o que não basta. Opções: estender o prazo para cerca de <b>${Math.ceil(left/(cap+maxCut))} meses</b>, diminuir a meta ou aumentar a renda.`;
  return `<div class="plan">${h}</div>`;
}

function tetoGasto(b,m){
  const ex=new Set(); state.bills.forEach(x=>{const e=(x.paidMonths||{})[m]; if(e&&e.txId) ex.add(e.txId);});
  state.cards.forEach(c=>c.purchases.forEach(p=>{const e=(p.paidMonths||{})[m]; if(e&&e.txId) ex.add(e.txId);}));
  const nb=norm(b.name);

function widgetChart(){
  const monthsWithData = [...new Set(state.transactions.map(t=>t.date.slice(0,7)))].sort();
  const pastMonths = monthsWithData.filter(m=>m<=ui.month).slice(-5);
  if(!pastMonths.includes(ui.month) && txInMonth().length>0) pastMonths.push(ui.month);
  const pastTotals = pastMonths.map(m=>({m, ...monthTotals(m), projected:false}));

  const priorMonthsWithData = monthsWithData.filter(m=>m<ui.month);
  const histTotals = priorMonthsWithData.slice(-3).map(m=>monthTotals(m));
  let projTotals = [];
  if(histTotals.length){
    const avgIncome = histTotals.reduce((s,t)=>s+t.income,0)/histTotals.length;
    const avgExpense = histTotals.reduce((s,t)=>s+t.expense,0)/histTotals.length;
    for(let i=1;i<=3;i++){
      const m = shiftMonth(ui.month,i);
      projTotals.push({m, income:avgIncome, expense:projExpenseFor(m,avgExpense), projected:true});
    }

  const all = [...pastTotals, ...projTotals];
  if(!all.length) return `<div class="empty">Nenhum lançamento ainda.</div>`;

  return `

      ${all.map(p=>`
        <div class="col">
          <div class="bars">

            <div class="bar ${p.projected?'projected':''}" style="height:${Math.round(p.expense/maxVal*120)}px;background:var(--red)" title="Saídas: ${fmt(p.expense)}"></div>

        </div>
      `).join('')}
    </div>
    <div style="display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;">
      <span><span class="dot" style="background:var(--green)"></span> Entradas</span>
      <span><span class="dot" style="background:var(--red)"></span> Saídas</span>
      ${projTotals.length ? '<span>* projeção (listrado)</span>' : ''}

function billsTotalForMonth(m){
  return state.bills.filter(b=>billApplies(b,m)).reduce((s,b)=>s+getBillAmount(b,m),0);
}
function knownCommittedForMonth(m){
  return billsTotalForMonth(m) + totalCommitmentForMonth(m);
}
function widgetProjectionsOld(){
  const monthsWithData = [...new Set(state.transactions.map(t=>t.date.slice(0,7)))].sort();
  const histMonths = monthsWithData.filter(m=>m<ui.month).slice(-3);
  if(!histMonths.length){
    return `<div class="empty">Preciso de pelo menos um mês <em>anterior</em> lançado pra projetar.</div>`;
  }
  const histTotals = histMonths.map(m=>monthTotals(m));
  const avgIncome = histTotals.reduce((s,t)=>s+t.income,0)/histTotals.length;
  // separa o que já era "conhecido" (contas+cartão) do que sobrou de variável em cada mês passado
  const histVariable = histMonths.map(m=>Math.max(0, monthTotals(m).expense - knownCommittedForMonth(m)));
  const avgVariable = histVariable.reduce((s,v)=>s+v,0)/histVariable.length;

  const rows = [];
  for(let i=1;i<=3;i++){
    const m = shiftMonth(ui.month,i);
    const known = knownCommittedForMonth(m);
    const balance = avgIncome - known - avgVariable;
    rows.push({m, known, balance});
  }
  const worst = rows.reduce((a,b)=> b.balance<a.balance ? b : a, rows[0]);

  let html = `<p style="font-size:11px;color:var(--muted);margin:0 0 8px;">Entrada média (${histMonths.length} mês(es)): ${fmt(avgIncome)} • Variável médio (fora contas/cartão): ${fmt(avgVariable)}</p>`;
  html += `<table><thead><tr><th>Mês</th><th style="text-align:right">Contas+cartão</th><th style="text-align:right">Saldo projetado</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    html += `<tr><td>${monthLabel(r.m)}</td><td class="num">${fmt(r.known)}</td><td class="num" style="color:${r.balance<0?'var(--red)':'var(--green)'}">${fmt(r.balance)}</td></tr>`;
  });
  html += `</tbody></table>`;

  if(worst.balance < 0){
    html += `<div class="insight warn" style="margin-top:10px;">Atenção: <strong>${monthLabel(worst.m)}</strong> deve fechar negativo em cerca de <strong>${fmt(worst.balance)}</strong>.</div>`;
  }
  // visão anual: só o que já é certeza (contas fixas + parcelas já cadastradas), sem estimativa variável
  let known12 = 0;
  for(let i=1;i<=12;i++) known12 += knownCommittedForMonth(shiftMonth(ui.month,i));
  if(known12>0) html += `<p style="font-size:11px;color:var(--muted);margin-top:8px;">Já garantido (contas fixas + parcelas) pros próximos 12 meses: <strong>${fmt(known12)}</strong>.</p>`;

  let maxEnd = null;
  state.cards.forEach(c=>c.purchases.forEach(p=>{
    const [y,m] = p.startMonth.split('-').map(Number);
    let em = m + p.installments - 1, ey = y;
    while(em>12){em-=12;ey++;}
    const endYm = ey+'-'+String(em).padStart(2,'0');
    if(!maxEnd || endYm > maxEnd) maxEnd = endYm;
  }));
  if(maxEnd) html += `<p style="font-size:11px;color:var(--muted);margin-top:4px;">Parcelas de cartão devem zerar em <strong>${monthLabel(maxEnd)}</strong>.</p>`;
  return html;
}

}
function toggleTxSelect(id){

function toggleSelectAllTx(checked){

function deleteAllInMonth(){
  const ids = txInMonth().map(t=>t.id);
  askConfirm(`Apagar TODOS os ${ids.length} lançamentos de ${monthLabel(ui.month)}?`, ()=>{
    state.transactions = state.transactions.filter(t=>!ids.includes(t.id));
    ui.selectedTx = ui.selectedTx.filter(id=>!ids.includes(id));
    state.bills.forEach(b=>{ const e=(b.paidMonths||{})[ui.month]; if(e && e.txId && ids.includes(e.txId)) delete b.paidMonths[ui.month]; });
    state.cards.forEach(c=>c.purchases.forEach(p=>{ const e=(p.paidMonths||{})[ui.month]; if(e && e.txId && ids.includes(e.txId)) delete p.paidMonths[ui.month]; }));

function toggleCategoryExpand(name){ ui.expandedCategory = ui.expandedCategory===name ? null : name; render(); }

const PAYMENT_METHODS = ['Pix','Cartão de débito','Cartão de crédito','Boleto','TED/DOC','Dinheiro','Outro'];
function isPaidEntry(entry){ return !!(entry && (entry===true || entry.paid)); }
function getPayMethod(obj, month){
  return (obj.paymentMethodOverrides && obj.paymentMethodOverrides[month]) || obj.paymentMethod || 'Outro';
}
function ensureCategoryExists(name, type){
  type = type || 'expense';
  let cat = state.categories.find(c=>normalizeStr(c.name)===normalizeStr(name) && c.type===type);
  if(!cat){ cat = {name, type, color: PALETTE[state.categories.length % PALETTE.length], keywords:[]}; state.categories.push(cat); }
  return cat;
}
function createLinkedTx({date, amount, category, paymentMethod, desc, linkedType, linkedBillId, linkedCardId, linkedPurchaseId, linkedMonth}){
  const tx = { id:uid(), date, desc, amount, type:'expense', category, paymentMethod, linkedType, linkedBillId, linkedCardId, linkedPurchaseId, linkedMonth };
  state.transactions.push(tx);
  return tx.id;
}
function removeLinkedTx(txId){
  if(!txId) return;
  state.transactions = state.transactions.filter(t=>t.id!==txId);
}
function billApplies(b, month){
  if(b.recurring) return true;
  return (b.months||[]).includes(month);
}
function billsInMonth(){ return state.bills.filter(b=>billApplies(b, ui.month)); }
function isBillPaid(b, month){ return isPaidEntry((b.paidMonths||{})[month]); }
function monthYearOptions(centerMonth){
  const year = centerMonth.slice(0,4);
  return Array.from({length:12}, (_,i)=> year+'-'+String(i+1).padStart(2,'0'));
}
function getBillAmount(b, month){
  return (b.amountOverrides && b.amountOverrides[month]!==undefined) ? b.amountOverrides[month] : b.amount;
}
function cardItemsInMonth(){
  const items = [];
  state.cards.forEach(card=>card.purchases.forEach(p=>{
    const val = monthlyCommitment(p, ui.month);
    if(val>0){
      const idx = monthsBetween(p.startMonth, ui.month) + 1;
      items.push({ cardId:card.id, purchaseId:p.id, name: card.name+' — '+p.desc+' ('+idx+'/'+p.installments+')', amount: val, paid: isPaidEntry((p.paidMonths||{})[ui.month]) });
    }
  }));
  return items;
}
function togglePurchasePaid(cardId, purchaseId){
  const card = state.cards.find(c=>c.id===cardId);
  const p = card && card.purchases.find(p=>p.id===purchaseId);
  if(!p) return;
  if(!p.paidMonths) p.paidMonths = {};
  const entry = p.paidMonths[ui.month];
  if(isPaidEntry(entry)){
    if(entry.txId) removeLinkedTx(entry.txId);
    delete p.paidMonths[ui.month];
    saveState(); render();
  } else {
    ui.modal = { type:'paidDate', kind:'purchase', cardId, purchaseId, date: new Date().toISOString().slice(0,10) };
    render();
  }
}
function billsView(){
  const bills = billsInMonth().sort((a,b)=>(a.dueDay||99)-(b.dueDay||99));
  const cardItems = cardItemsInMonth();
  const total = bills.reduce((s,b)=>s+getBillAmount(b, ui.month),0) + cardItems.reduce((s,c)=>s+c.amount,0);
  const paid = bills.filter(b=>isBillPaid(b, ui.month)).reduce((s,b)=>s+getBillAmount(b, ui.month),0) + cardItems.filter(c=>c.paid).reduce((s,c)=>s+c.amount,0);
  const pending = total - paid;
  const totals = monthTotals(ui.month);
  // saldo disponível de verdade: entradas menos TODAS as saídas já lançadas no mês
  // (não só as contas marcadas como pagas) — assim gastos feitos "em outro lugar" entram na conta
  const saldoDisponivel = totals.income - totals.expense;
  const falta = Math.max(0, pending - saldoDisponivel);
  const sobra = Math.max(0, saldoDisponivel - pending);
  return `
    ${monthNav()}
    <div class="card">
      <h2>Resumo de ${monthLabel(ui.month)}</h2>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;">
        <div class="pill" style="background:var(--surface-2);"><div class="plabel" style="color:var(--muted);">Total (contas + cartão)</div><div class="pval" style="color:var(--ink);">${fmt(total)}</div></div>
        <div class="pill" style="background:var(--green-soft);"><div class="plabel" style="color:var(--green);">Já pago</div><div class="pval" style="color:var(--green);">${fmt(paid)}</div></div>
        <div class="pill" style="background:var(--red-soft);"><div class="plabel" style="color:var(--red);">Pendente</div><div class="pval" style="color:var(--red);">${fmt(pending)}</div></div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin:12px 0 0;">Saldo disponível real este mês: entradas (${fmt(totals.income)}) menos <strong>todas</strong> as saídas já lançadas em Lançamentos (${fmt(totals.expense)}) = <strong>${fmt(saldoDisponivel)}</strong>. Isso já considera dinheiro gasto em outras coisas, não só as contas marcadas aqui.</p>
      ${pending>0 ? `<div class="insight ${falta>0?'warn':'good'}" style="margin-top:14px;">
        ${falta>0
          ? `Considerando o que já entrou e o que já saiu pra outras coisas este mês, ainda falta <strong>${fmt(falta)}</strong> pra cobrir as contas e parcelas de cartão pendentes.`
          : `O saldo disponível (${fmt(saldoDisponivel)}) já cobre as contas e parcelas pendentes — sobra <strong>${fmt(sobra)}</strong>.`}
      </div>` : ''}
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2>Contas e parcelas de ${monthLabel(ui.month)}</h2>
        <button class="btn btn-ghost" onclick="openBillModal()">+ Nova conta</button>
      </div>
      ${(bills.length || cardItems.length) ? `<table>
        <thead><tr><th></th><th>Conta</th><th>Vencimento</th><th>Recorrência</th><th style="text-align:right">Valor</th><th></th></tr></thead>
        <tbody>
          ${cardItems.map(c=>`
            <tr>
              <td><input type="checkbox" ${c.paid?'checked':''} onchange="togglePurchasePaid('${c.cardId}','${c.purchaseId}')"/></td>
              <td style="${c.paid?'text-decoration:line-through;color:var(--muted);':''}">${c.name}</td>
              <td>—</td>
              <td><span class="tag">💳 Cartão</span></td>
              <td class="num">${fmt(c.amount)}</td>
              <td></td>
            </tr>
          `).join('')}
          ${bills.map(b=>{
            const hasOverride = b.amountOverrides && b.amountOverrides[ui.month]!==undefined;
            return `
            <tr>
              <td><input type="checkbox" ${isBillPaid(b, ui.month)?'checked':''} onchange="toggleBillPaid('${b.id}')"/></td>
              <td style="${isBillPaid(b, ui.month)?'text-decoration:line-through;color:var(--muted);':''}">${b.name}</td>
              <td>${b.dueDay ? 'dia '+b.dueDay : '—'}</td>
              <td><span class="tag">${b.recurring ? 'Todo mês' : (b.months||[]).length+' mês(es)'}</span></td>
              <td class="num">
                ${fmt(getBillAmount(b, ui.month))}
                ${hasOverride ? `<span class="tag" title="Valor diferente do padrão só neste mês" style="margin-left:4px;">✎ só ${monthLabel(ui.month).split(' / ')[0]}</span>` : ''}
              </td>
              <td class="row-actions">
                <button onclick="openBillModal('${b.id}')" title="Editar conta">${icon('edit')}</button>
                <button onclick="deleteBill('${b.id}')" title="Excluir">${icon('trash')}</button>
              </td>
            </tr>
          `;}).join('')}
        </tbody>
      </table>` : `<div class="empty">Nenhuma conta ou parcela de cartão pra esse mês.</div>`}
    </div>
  `;
}
function openBillModal(id){
  if(id){
    const b = state.bills.find(b=>b.id===id);
    const monthOverride = (b.amountOverrides && b.amountOverrides[ui.month]!==undefined) ? b.amountOverrides[ui.month] : null;
    const monthPaymentOverride = (b.paymentMethodOverrides && b.paymentMethodOverrides[ui.month]) || '';
    ui.modal = { type:'bill', edit:id, name:b.name, amount:b.amount, dueDay:b.dueDay||'', recurring:!!b.recurring, months:(b.months||[ui.month]).slice(), monthOverride, paymentMethod:b.paymentMethod||'Outro', monthPaymentOverride };
  } else {
    ui.modal = { type:'bill', edit:null, name:'', amount:'', dueDay:'', recurring:false, months:[ui.month], monthOverride:null, paymentMethod:'Outro', monthPaymentOverride:'' };
  }
  render();

  renderModal2();

function toggleBillPaid(id){
  const b = state.bills.find(b=>b.id===id);
  if(!b) return;
  if(!b.paidMonths) b.paidMonths = {};
  const entry = b.paidMonths[ui.month];
  if(isPaidEntry(entry)){
    if(entry.txId) removeLinkedTx(entry.txId);
    delete b.paidMonths[ui.month];
    saveState(); render();

    ui.modal = { type:'paidDate', kind:'bill', billId:id, date: new Date().toISOString().slice(0,10) };

function confirmPaidDate(){
  const date = document.getElementById('mPaidDate').value;
  if(!date){ alert('Escolha uma data.'); return; }
  const mk=document.getElementById('mCreateTx'), make=!mk||mk.checked;
  if(ui.modal.kind==='bill'){
    const b = state.bills.find(b=>b.id===ui.modal.billId);
    if(make) ensureCategoryExists(b.name);
    const txId = !make ? null : createLinkedTx({
      date, amount:getBillAmount(b, ui.month), category:b.name, paymentMethod:getPayMethod(b, ui.month), desc:b.name,
      linkedType:'bill', linkedBillId:b.id, linkedMonth:ui.month
    });
    if(!b.paidMonths) b.paidMonths = {};
    b.paidMonths[ui.month] = { paid:true, txId };
  } else {
    const card = state.cards.find(c=>c.id===ui.modal.cardId);
    const p = card.purchases.find(p=>p.id===ui.modal.purchaseId);
    if(make) ensureCategoryExists(card.name);
    const txId = !make ? null : createLinkedTx({
      date, amount:getPurchaseInstallmentAmount(p, ui.month), category:card.name, paymentMethod:getPayMethod(p, ui.month), desc:card.name+' — '+p.desc,
      linkedType:'purchase', linkedCardId:card.id, linkedPurchaseId:p.id, linkedMonth:ui.month
    });
    if(!p.paidMonths) p.paidMonths = {};
    p.paidMonths[ui.month] = { paid:true, txId };
  }
  cleanupEmptyAutoCategories();
  saveState(); closeModal();
}
function deleteBill(id){
  askConfirm('Excluir esta conta?', ()=>{
    state.bills = state.bills.filter(b=>b.id!==id);
    saveState(); render();
  });
}
function saveBill(){
  const name = document.getElementById('mBillName').value;
  const amount = parseFloat(document.getElementById('mBillAmount').value);
  const dueDay = parseInt(document.getElementById('mBillDue').value,10) || null;
  const recurring = document.getElementById('mBillRecurring').checked;
  const paymentMethod = document.getElementById('mBillPaymentMethod').value;
  if(!name || !amount){ alert('Preencha nome e valor.'); return; }
  if(!recurring && !ui.modal.months.length){ alert('Selecione pelo menos um mês, ou marque como recorrente.'); return; }
  if(ui.modal.edit){
    const b = state.bills.find(b=>b.id===ui.modal.edit);
    Object.assign(b, { name, amount, dueDay, recurring, paymentMethod, months: recurring ? [] : ui.modal.months.slice() });
    const overrideEl = document.getElementById('mBillMonthOverride');
    if(overrideEl){
      const raw = overrideEl.value;
      if(!b.amountOverrides) b.amountOverrides = {};
      if(raw === '') delete b.amountOverrides[ui.month];
      else b.amountOverrides[ui.month] = parseFloat(raw);
    }
    const pmOverrideEl = document.getElementById('mBillMonthPaymentOverride');
    if(pmOverrideEl){
      const raw = pmOverrideEl.value;
      if(!b.paymentMethodOverrides) b.paymentMethodOverrides = {};
      if(raw === '') delete b.paymentMethodOverrides[ui.month];
      else b.paymentMethodOverrides[ui.month] = raw;
    }
  } else {
    state.bills.push({ id: uid(), name, amount, dueDay, recurring, paymentMethod, months: recurring ? [] : ui.modal.months.slice(), paidMonths:{}, amountOverrides:{}, paymentMethodOverrides:{} });
  }
  saveState(); closeModal();
}

function loadSuggestedCategories(){
  askConfirm('Isso vai adicionar categorias e palavras-chave prontas, mesclando com as que você já tem. Continuar?', ()=>{
    SUGGESTED_CATEGORIES.forEach(sc=>{
      const existing = state.categories.find(c=>normalizeStr(c.name)===normalizeStr(sc.name) && c.type===sc.type);
      if(existing) sc.keywords.forEach(kw=>{ if(!existing.keywords.some(k=>normalizeStr(k)===normalizeStr(kw))) existing.keywords.push(kw); });
      else state.categories.push({name: sc.name, type: sc.type, color: sc.color, keywords: [...sc.keywords]});
    });
    saveState();
    askConfirm('Categorias adicionadas! Quer reclassificar os lançamentos já existentes agora?', ()=>{
      state.transactions.forEach(t=>{ t.category = guessCategory(t.desc, t.type); });
      saveState(); render();
    });
  });
}
function exportBackup(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().slice(0,10);
  a.download = `cofre-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleBackupFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    let loaded;
    try{ loaded = JSON.parse(ev.target.result); }
    catch(err){ alert('Esse arquivo não parece ser um backup válido do Cofre.'); return; }
    if(!loaded || !Array.isArray(loaded.transactions) || !Array.isArray(loaded.categories)){
      alert('Esse arquivo não parece ser um backup válido do Cofre.');
      return;
    }
    askConfirm('Isso vai SUBSTITUIR todos os dados atuais do app pelos dados desse backup. Os dados de agora serão perdidos se você não tiver outro backup deles. Continuar?', ()=>{
      state = Object.assign({ bills:[], dashboardPrefs:{order:['chart','categories','categoriesIncome','commitments','projections'],collapsed:{}} }, loaded);
      if(!state.dashboardPrefs) state.dashboardPrefs = {order:['chart','categories','categoriesIncome','commitments','projections'],collapsed:{}};
      migrateDashboardOrder();
      migrateCategoryTypes();
      state.bills = migrateBills(state.bills);
      ui.selectedTx = [];
      saveState();
      ui.tab = 'dashboard';
      render();
    });
  };
  reader.readAsText(file);
}

  learnFromCorrection(desc, category, ui.modal.txType);
  if(ui.modal.edit){
    const t = state.transactions.find(t=>t.id===ui.modal.edit);
    Object.assign(t, {amount, desc, paymentMethod, date, category, type: ui.modal.txType});

    state.transactions.push({id:uid(), amount, desc, paymentMethod, date, category, type: ui.modal.txType});

  cleanupEmptyAutoCategories(); saveState(); closeModal();
}
function saveCard(){
  const name = document.getElementById('mCardName').value;
  const owner = document.getElementById('mCardOwner').value;
  if(!name){ alert('Dê um nome ao cartão.'); return; }
  state.cards.push({id:uid(), name, owner, purchases:[]});
  saveState(); closeModal(); ui.tab = 'cartoes'; render();
}
function savePurchase(){
  const desc = document.getElementById('mPDesc').value || 'Compra';
  const installmentValue = parseFloat(document.getElementById('mPInstallmentValue').value);
  const installments = parseInt(document.getElementById('mPInst').value,10);
  const startMonth = document.getElementById('mPStart').value;
  const paymentMethod = document.getElementById('mPPaymentMethod').value;
  if(!installmentValue || !installments || !startMonth){ alert('Preencha valor da parcela, quantidade e mês inicial.'); return; }
  const card = state.cards.find(c=>c.id===ui.modal.cardId);
  if(ui.modal.edit){
    const p = card.purchases.find(p=>p.id===ui.modal.edit);
    Object.assign(p, { desc, installmentValue, installments, total: installmentValue*installments, startMonth, paymentMethod });
  } else {
    card.purchases.push({id:uid(), desc, installmentValue, installments, total: installmentValue*installments, startMonth, paymentMethod, amountOverrides:{}, paymentMethodOverrides:{}, paidMonths:{}});
  }
  saveState(); closeModal(); ui.tab = 'cartoes'; render();
}
